    <meta name="description" content="名籍，下相人，楚將項燕之孫。前209年隨叔父項梁起兵於吳。前207年鉅鹿之戰「皆沈船，破釜甑，燒廬舍，持三日糧」，大破秦軍。入關後自立為西楚霸王，都彭城，分封諸侯。楚漢相爭，前202年被圍垓下，夜聞四面楚歌，突圍至烏江，不肯渡江而死。" />
