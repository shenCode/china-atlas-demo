    <title>三道伐鮮卑之役（177年） · 華夏歷史輿圖</title>
    <meta name="description" content="鮮卑檀石槐寇抄漢邊不止，拒受王號，分其地為三部。熹平六年八月，漢遣夏育出高柳、田晏出雲中、臧旻率南單于出鴈門，各領萬騎，三道出塞二千餘里。檀石槐命三部大人各率眾迎戰，夏育等大敗，失其節傳輜重，各率數十騎逃還，士卒死者十之七八。" />
