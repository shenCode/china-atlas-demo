    <title>秦拔宜陽（前307年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦武王使甘茂伐韓，攻宜陽，五月不拔；樗里子、公孫奭在朝中爭之，武王欲罷兵，甘茂以「息壤」之盟相提醒，王乃悉起兵助之。秦遂拔宜陽，斬首六萬，渡河築武遂。宜陽是韓的大縣，秦由此通三川、窺周室。" />
