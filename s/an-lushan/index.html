    <title>安祿山（703–757年） · 華夏歷史輿圖</title>
    <meta name="description" content="營州柳城胡人，兼任平盧、范陽、河東三鎮節度使。755年十一月率蕃、漢之兵十餘萬自幽州南下，以誅楊國忠為名起兵，十二月陷洛陽，756年在洛陽稱大燕皇帝，同年六月破潼關，玄宗奔蜀。757年為其子安慶緒所殺。" />
