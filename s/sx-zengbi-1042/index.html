    <title>慶曆增幣（富弼使遼）（1042年） · 華夏歷史輿圖</title>
    <meta name="description" content="宋與西夏交兵連敗，遼興宗乘勢聚兵幽州，遣使求關南十縣地。宋遣富弼使遼，拒割地，許以結婚或增歲幣二事聽遼擇其一。遼取增幣：若能令夏國復納款，歲增金帛二十萬，否則十萬；遂於澶淵歲幣三十萬之外歲增銀絹共二十萬。" />
