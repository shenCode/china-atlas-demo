    <meta name="description" content="秦昭王十四年（前293），白起攻韓、魏於伊闕，斬首二十四萬，虜其將公孫喜，拔五城。東漢中平元年（184）置八關都尉，伊闕為其一。隋煬帝營東京，宮城北據邙山，「南直伊闕之口」；煬帝登邙山望伊闕，曰：「此非龍門邪？」" />
