    <title>苻堅得道安於襄陽（379年） · 華夏歷史輿圖</title>
    <meta name="description" content="道安避亂南投襄陽，立寺講經十五年。苻丕攻襄陽，「安與朱序俱獲於堅」，堅曰：「朕以十萬之師取襄陽，唯得一人半。」安遂至長安，主持譯經。" />
