    <title>太原之戰（李光弼守太原）（757年） · 華夏歷史輿圖</title>
    <meta name="description" content="至德二載正月，史思明自博陵、蔡希德自太行、高秀巖自大同、牛廷介自范陽，引兵共十萬寇太原。李光弼不修城而募軍中有技者，穿地道以破攻具。會安祿山死，安慶緒使思明歸守范陽，留蔡希德等圍城；光弼率敢死士出擊，大破之，斬首七萬餘級，希德遁去。" />
