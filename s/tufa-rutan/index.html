    <meta name="description" content="南涼君主。於三堆下馬踞胡床，安定軍心，擊敗呂纂，又乘虛襲姑臧；後在陽武為赫連勃勃所敗。後秦姚弼來伐，傉檀分兵擊之，斬首七千餘級。窮泉一戰為沮渠蒙遜所敗，遷都樂都；後率騎襲乙弗，乞伏熾磐乘虛襲樂都，城潰，傉檀至西平歸附熾磐。" />
