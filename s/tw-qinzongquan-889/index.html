    <title>秦宗權伏誅（889年） · 華夏歷史輿圖</title>
    <meta name="description" content="黃巢敗後，蔡州節度使秦宗權稱帝，分遣諸將四出，所過屠掠，中原州縣殘破。宣武朱全忠連年與之戰而漸勝；宗權為其將申叢所執；蔡將郭璠又殺叢，送宗權於汴。龍紀元年二月，全忠送宗權至京師，斬於獨柳。全忠自此雄於河南。" />
