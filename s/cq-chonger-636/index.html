    <title>秦納重耳（晉文公入國）（前636年） · 華夏歷史輿圖</title>
    <meta name="description" content="公子重耳出亡十九年，歷狄、衛、齊、曹、宋、鄭、楚而至秦。晉懷公立，秦繆公發兵送重耳入晉，欒、郤之黨為內應。二月辛丑，咎犯與秦晉大夫盟于郇；壬寅，重耳入于晉師；懷公奔高梁，被殺。重耳立，是為文公，四年後敗楚於城濮。" />
