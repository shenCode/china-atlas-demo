    <title>高平之戰（954年） · 華夏歷史輿圖</title>
    <meta name="description" content="周世宗柴榮即位不久，北漢劉旻聯合契丹來攻。顯德元年三月，世宗親征，在高平與北漢軍激戰，右軍將領樊愛能、何徽臨陣脫逃，世宗親冒矢石督戰，趙匡胤等奮擊，終獲大勝。戰後世宗斬樊愛能、何徽等七十餘將，整頓禁軍。" />
