    <meta name="description" content="1234年宋蒙聯軍滅金後，宋理宗聽從趙范、趙葵之議，乘蒙古北撤收復三京：全子才、趙葵率軍入汴京，徐敏子進入洛陽。宋軍因糧運不繼，在洛陽城外被蒙古軍擊潰而退。蒙古以宋敗盟為由，次年起大舉攻宋，宋蒙戰爭持續四十餘年。" />
