    <title>七介山之役（吳提乘虛犯塞）（439年） · 華夏歷史輿圖</title>
    <meta name="description" content="太延五年拓跋燾西伐北涼沮渠牧犍，留穆壽輔太子居守，又遣嵇敬、拓跋崇率二萬人鎮漠南以防柔然。柔然吳提果然乘虛犯塞，穆壽未加防備，柔然兵至七介山，京城大駭，眾人爭奔中城，長孫道生拒之於吐頹山。" />
