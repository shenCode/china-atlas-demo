    <meta name="description" content="名柴榮，本姓柴，郭威皇后的姪子，被郭威收為養子。954年即位，高平之戰大勝，整頓禁軍、限制佛寺、擴建開封城，取淮南十四州，北伐收復三關，被視為五代最英明的君主。死後六個月，趙匡胤發動陳橋兵變奪取後周政權。" />
