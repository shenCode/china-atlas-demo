    <title>玉門關（前108–628年） · 華夏歷史輿圖</title>
    <meta name="description" content="漢通西域的北門。趙破奴破姑師後，「酒泉列亭鄣至玉門」。李廣利伐大宛，士卒饑乏，上書請罷兵，武帝大怒，「使使遮玉門」，軍有敢入者輒斬。《漢書·西域傳》稱西域「東則接漢，厄以玉門、陽關」，出玉門、陽關有南北二道。東漢班超上疏：「但願生入玉門關。" />
