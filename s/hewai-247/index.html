    <title>信陵君率五國敗秦於河外（前247年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦蒙驁伐魏，取高都、汲，魏師屢敗。魏王派人到趙國請回留趙十年的信陵君；毛公、薛公勸之，信陵君乃歸，魏王以為上將軍。諸侯聞信陵君為將，皆遣兵救魏。信陵君率五國之兵敗蒙驁於河外，蒙驁遁走，追至函谷關而還。" />
