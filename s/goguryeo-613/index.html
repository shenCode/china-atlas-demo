    <title>隋煬帝再征、三征高句麗（613年） · 華夏歷史輿圖</title>
    <meta name="description" content="大業九年三月，隋煬帝再次親征高句麗，四月渡遼水，遣宇文述、楊義臣進趨平壤；六月禮部尚書楊玄感反於黎陽，煬帝班師，高句麗襲擊隋軍後隊，李景斷後。大業十年七月煬帝第三次東征，駐懷遠鎮，高句麗遣使請降，並囚送斛斯政，八月班師。" />
