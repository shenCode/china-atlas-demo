    <title>水洛城之戰（530年） · 華夏歷史輿圖</title>
    <meta name="description" content="万俟道洛入隴投奔略陽賊帥王慶雲，王慶雲自稱皇帝。尒朱天光率軍入隴，至水洛城，破其東城，賊眾聚於缺水的西城。天光許其次日答覆，又稍退讓其取水，令賊心懈怠，暗中令軍士多作七尺木槍，黃昏時周匝立槍、伏兵其中。" />
