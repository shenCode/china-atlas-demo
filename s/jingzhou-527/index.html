    <title>涇州之戰（蕭寶夤大敗）（527年） · 華夏歷史輿圖</title>
    <meta name="description" content="孝昌三年正月，蕭寶夤、元恒芝大敗於涇州，大隴、小隴都督相繼退散，東秦州刺史潘義淵以汧城降賊。高平虜賊進逼岐州，城人執刺史魏蘭根以城相應；豳州刺史畢祖暉戰死，行臺羊深奔退。" />
