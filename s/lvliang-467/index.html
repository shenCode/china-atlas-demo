    <meta name="description" content="天安元年，薛安都以徐州內附北魏，請魏出兵救援。宋明帝遣張永、沈攸之等討薛安都，屯於下磕。尉元令薛安都等固守，自率精銳分擊呂梁，斷宋軍糧道；張永勢挫力屈，被圍後棄城夜遁。" />
