    <title>窮泉之戰與沮渠蒙遜取姑臧（410年） · 華夏歷史輿圖</title>
    <meta name="description" content="沮渠蒙遜率步騎三萬伐南涼，至顯美擄數千戶而還；禿髮傉檀追及於窮泉，蒙遜趁其營壘未成進擊，傉檀大敗，單騎奔還。蒙遜乘勝至姑臧，夷夏降者萬數千戶，傉檀請和。傉檀懼為蒙遜所滅，遷都樂都，魏安人焦朗據姑臧自立；蒙遜率步騎三萬攻克姑臧，赦焦朗。" />
