    <title>陳慶之入洛（528年） · 華夏歷史輿圖</title>
    <meta name="description" content="大通二年冬，梁武帝立北魏降王元顥為魏主，遣陳慶之率軍數千護送北還。次年陳慶之白袍軍自銍縣出發，轉戰至洛陽，十四旬平三十二城，四十七戰。元顥入洛後不久為爾朱榮所敗，陳慶之全軍覆沒，僅以身免。" />
