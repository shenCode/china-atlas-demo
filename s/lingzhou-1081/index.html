    <title>五路伐夏（靈州之役）（1081年） · 華夏歷史輿圖</title>
    <meta name="description" content="元豐四年七月，邊臣奏報夏人囚禁其主秉常，宋詔陝西、河東諸路討伐。九月李憲收復蘭州古城；种諤擊敗來救米脂砦的夏軍，又敗夏人於無定川，十月米脂砦降。高遵裕收復清遠軍，又復韋州；李憲敗夏人於屈吳山；种諤入夏州。" />
