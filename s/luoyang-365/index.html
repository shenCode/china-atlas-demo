    <title>洛陽之陷（沈勁死守）（364年） · 華夏歷史輿圖</title>
    <meta name="description" content="前燕慕容恪侵逼洛陽，晉冠軍將軍陳祐守城，兵不過二千；沈勁自募壯士千餘人相助，屢以寡敵眾。其後糧盡援絕，陳祐藉口救許昌，於興寧三年留沈勁以五百人守城，自率眾東去。沈勁決意死守，不久為慕容恪所攻，城陷被執，神色自若，終遇害。" />
