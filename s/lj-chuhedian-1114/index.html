    <title>出河店之戰（1114年） · 華夏歷史輿圖</title>
    <meta name="description" content="女真完顏阿骨打起兵反遼，先取寧江州。遼以蕭嗣先為東北路都統，發契丹、奚軍與諸路兵屯出河店。十一月，阿骨打夜渡混同江，黎明及河，擊走遼人，登岸與遼兵遇於出河店；會大風起，塵埃蔽天，乘風奮擊，遼兵潰，將士得免者無幾。" />
