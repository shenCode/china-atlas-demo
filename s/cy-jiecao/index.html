    <meta name="description" content="意為受恩深重，死後也要報答（常與「銜環」連用）。晉魏顆在輔氏敗秦師，俘秦力士杜回。當初魏武子病重時命以嬖妾殉葬，魏顆從其清醒時之命，把她改嫁了。輔氏之役，魏顆見一老人「結草以亢杜回，杜回躓而顛」，夜夢老人說：我是你所嫁婦人之父，以此相報。" />
