    <title>秦王廷見相如，畢禮而歸之；趙拜相如為上大夫（前283年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦王齋五日後，設九賓之禮於廷，引見藺相如。相如說：秦自穆公以來二十餘君，未有堅明約束者，臣恐見欺於王而負趙，已令人持璧歸趙；秦強趙弱，大王先割十五都予趙，趙豈敢留璧？臣知欺大王之罪當誅，請就湯鑊。秦王與群臣相視而嘻。" />
