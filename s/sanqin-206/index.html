    <meta name="description" content="漢元年八月，漢王用韓信之計，從故道北還，襲擊雍王章邯。章邯迎戰於陳倉，敗走；再戰於好畤，又敗，退守廢丘。漢王遂定雍地，東至咸陽，圍章邯於廢丘，遣諸將略定隴西、北地、上郡。" />
