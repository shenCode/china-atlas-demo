    <title>淝水之戰（383年） · 華夏歷史輿圖</title>
    <meta name="description" content="太元八年，前秦苻堅傾國南伐，前鋒苻融攻陷壽陽。東晉以謝石、謝玄等率北府兵迎戰，劉牢之先破秦軍於洛澗；兩軍隔淝水對陣，秦軍後撤時陣腳大亂，苻融戰死，全軍潰敗。前秦隨之瓦解，南北分立之局延續。" />
