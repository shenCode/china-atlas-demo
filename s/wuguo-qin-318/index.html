    <title>五國攻秦（修魚之戰）（前318年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦惠文王更元七年（前318），韓、趙、魏、燕、齊帥匈奴共攻秦。《楚世家》記楚懷王為從長，諸國兵至函谷關，秦出兵擊之，皆引而歸。秦使庶長疾（樗里疾）與戰於修魚，虜韓將申差，敗趙公子渴、韓太子奐，斬首八萬二千。" />
