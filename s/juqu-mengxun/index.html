    <meta name="description" content="北涼君主。叛呂光，攻陷臨松郡，屯兵金山，與從兄男成推段業為涼州牧；呂纂來討，敗之於合離。後伐禿髮傉檀，於窮泉趁其營壘未成擊敗之，乘勝至姑臧；傉檀南遷樂都後，攻克據姑臧自立的焦朗，遷都姑臧，稱河西王。又以水灌敦煌，屠其城。" />
