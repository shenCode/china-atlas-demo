    <title>張覺據平州歸宋（1123年） · 華夏歷史輿圖</title>
    <meta name="description" content="金得燕京，驅燕人東徙。宣和五年，遼降將、金之南京留守張覺見燕民流離過平州，殺金所任之左企弓等，據平州歸宋；宋納之，建為泰寧軍。金兵來攻，覺敗奔燕山，金人索之，宋殺覺函首以送。金怨宋納叛，六年已攻蔚州；次年以此為辭，分兩路南侵。" />
