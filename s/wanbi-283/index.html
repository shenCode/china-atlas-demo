    <meta name="description" content="藺相如奉和氏璧西入秦。秦王坐章臺見相如，得璧大喜，傳給美人和左右觀看，左右皆呼萬歲。相如見秦王無意償趙城邑，上前說「璧有瑕，請指示王」，取回璧，退後倚柱，怒髮上衝冠，說：大王若要相逼，「臣頭今與璧俱碎於柱矣！」持璧睨柱，作勢欲撞。" />
