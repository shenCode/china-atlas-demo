    <title>吳王夫差賜伍子胥死（前484年） · 華夏歷史輿圖</title>
    <meta name="description" content="伍子胥屢諫吳王夫差勿信越、勿伐齊，夫差不聽；太宰嚭又進讒言，說他把兒子託付給齊國的鮑氏，有外心。夫差「乃使使賜伍子胥屬鏤之劍，曰：『子以此死。』」子胥臨死說：把我的眼睛掛在吳東門上，好看越寇入滅吳。遂自剄。" />
