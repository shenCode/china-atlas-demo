    <title>雲中之圍（大檀圍拓跋燾）（424年） · 華夏歷史輿圖</title>
    <meta name="description" content="始光元年八月，柔然大檀率六萬騎入雲中，殺掠吏民，攻陷盛樂宮。拓跋燾親自討之，三日二夜趕至雲中，大檀騎兵圍之五十餘重，騎兵逼至馬首，相次如牆，士卒大懼，拓跋燾面不改色，眾心乃安。魏軍射殺柔然部帥於陟斤，大檀恐懼而還。" />
