    <title>義陽之圍（504年） · 華夏歷史輿圖</title>
    <meta name="description" content="天監三年，北魏圍梁司州（義陽）。城中不滿五千人，糧僅支半年，魏軍晝夜攻擊，蔡道恭隨方抗禦；魏軍以大車載土填壍，蔡道恭於壍內列艨衝鬬艦拒之，相持百餘日。五月蔡道恭卒，魏軍攻之轉急；梁援軍曹景宗至鑿峴頓兵不前，八月城中糧盡而陷。" />
