    <title>高平陵之變（249年） · 華夏歷史輿圖</title>
    <meta name="description" content="嘉平元年正月，少帝曹芳往高平陵祭掃魏明帝，輔政的大將軍曹爽兄弟隨行。稱病多年的太傅司馬懿乘機關閉洛陽城門，奏請永寧太后罷免曹爽兄弟，隨後誅殺曹爽及其黨羽，夷三族。魏國大權從此歸於司馬氏。" />
