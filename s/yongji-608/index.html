    <title>開永濟渠（608年） · 華夏歷史輿圖</title>
    <meta name="description" content="大業四年正月，隋煬帝徵發河北諸郡男女百餘萬人開鑿永濟渠，引沁水南通黃河，北通涿郡（今北京一帶），為征伐高句麗運送兵員糧草。與通濟渠、邗溝、江南河共同構成隋朝大運河。" />
