    <title>睢陽之戰（張巡、許遠）（757年） · 華夏歷史輿圖</title>
    <meta name="description" content="至德二載正月，尹子奇來攻睢陽，太守許遠告急於張巡，巡自寧陵引兵入睢陽共守。巡屢出奇兵破敵，然城中日蹙，令南霽雲率三十騎犯圍而出，告急於臨淮，援兵不至。十月癸丑，叛軍登城，將士病不能戰，城陷，巡、遠等皆死。睢陽堅守十月，江淮賴以保全。" />
