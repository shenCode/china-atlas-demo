    <title>張衡造地動儀（132年） · 華夏歷史輿圖</title>
    <meta name="description" content="陽嘉元年，太史令張衡造候風地動儀：以精銅鑄成，直徑八尺，形似酒尊，飾以篆文與山龜鳥獸；內有都柱，旁出八道，設有機關；外有八龍口銜銅丸，下有蟾蜍張口承接。某方地動，該方龍口吐丸，落入蟾蜍口中，從而知道地震的方向。" />
