    <title>楊素破達頭可汗（598年） · 華夏歷史輿圖</title>
    <meta name="description" content="突厥達頭可汗犯塞，隋以楊素為靈州道行軍總管出塞討之。以往諸將與突厥作戰，皆以戎車、步騎相參，以鹿角圍成方陣，騎兵居內；楊素認為此乃自固之道而非取勝之方，盡廢舊法，令諸軍列為騎陣。" />
