    <meta name="description" content="晉惠公得秦之助而立，背許秦之河西地；晉饑，秦輸粟，秦饑，晉不與。秦繆公十五年九月壬戌，與晉惠公合戰韓原，晉軍敗，繆公虜晉君以歸。因夫人（惠公之姊）之請而歸之，晉獻河西地，太子圉為質於秦。" />
