    <title>疏勒城之圍（耿恭固守）（75年） · 華夏歷史輿圖</title>
    <meta name="description" content="永平十八年三月，北單于遣左鹿蠡王二萬騎擊車師，殺後王安得，攻金蒲城。耿恭以疏勒城旁有澗水可固，五月移兵據守。七月匈奴擁絕澗水，耿恭於城中穿井十五丈不得水，吏士笮馬糞汁而飲。" />
