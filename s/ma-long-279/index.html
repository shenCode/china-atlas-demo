    <title>馬隆平涼州（279年） · 華夏歷史輿圖</title>
    <meta name="description" content="涼州刺史楊欣失羌戎之和，為虜所沒，河西斷絕。馬隆率所募勇士西渡溫水，樹機能等眾以萬計，或乘險阻其前，或設伏截其後；馬隆依八陣圖作偏箱車，地廣則結鹿角車營，路狹則於車上施木屋，且戰且前，又夾道累磁石阻滯披鐵鎧的敵兵，轉戰千里。" />
