    <title>遼（907–1125年） · 華夏歷史輿圖</title>
    <meta name="description" content="契丹迭剌部耶律阿保機於907年燔柴告天、即皇帝位，916年建元神冊。938年後晉以幽、薊等十六州並圖籍獻契丹，遼以皇都為上京臨潢府，升幽州為南京。1004年與宋訂澶淵之盟。1125年天祚帝為金所俘，遼亡；耶律大石西走，建西遼。" />
