    <meta name="description" content="哲宗紹聖以後復行開邊。四年，知渭州章楶於葫蘆河川築城，二旬有二日而成，賜名平夏城，扼西夏南下之路。元符元年，夏梁太后與乾順傾國來攻，圍城十餘日不克；章楶禦之，遣將襲擒其勇將嵬名阿埋、西壽監軍妹勒都逋，斬俘甚眾。" />
