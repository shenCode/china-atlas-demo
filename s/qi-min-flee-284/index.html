    <title>齊湣王出亡，淖齒殺之於莒（前284年） · 華夏歷史輿圖</title>
    <meta name="description" content="五國之師破齊，燕軍入臨淄。齊湣王出亡到衛，衛君讓出宮室、稱臣供具；湣王不遜，衛人侵之。他轉奔鄒、魯，仍有驕色，鄒、魯不納，遂走莒。楚使淖齒將兵救齊，因而為齊相；淖齒想與燕分齊地，就拘執湣王，歷數其罪而殺之。" />
