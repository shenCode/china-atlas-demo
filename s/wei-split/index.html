    <title>北魏分裂（534年） · 華夏歷史輿圖</title>
    <meta name="description" content="永熙三年七月，北魏孝武帝與高歡決裂，西奔長安投宇文泰。高歡另立孝靜帝，十月遷都鄴，是為東魏；孝武帝旋為宇文泰所殺，宇文泰次年立文帝於長安，是為西魏。北方一分為二。" />
