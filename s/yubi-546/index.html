    <title>玉壁之戰（546年） · 華夏歷史輿圖</title>
    <meta name="description" content="武定四年九月，高歡傾力圍攻西魏玉壁，守將韋孝寬堅守。東魏堆土山、鑿地道、移汾水斷其水源，攻城五十日不下，死者七萬人。高歡憂憤成疾，次年病逝。" />
