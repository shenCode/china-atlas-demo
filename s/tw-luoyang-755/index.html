    <title>安祿山陷東京（755年） · 華夏歷史輿圖</title>
    <meta name="description" content="安祿山十一月反於范陽，引兵南下。十二月癸巳陷滎陽。封常清所募兵皆白徒，未經訓練，屯武牢以拒，叛軍以鐵騎蹂之，官軍大敗。丁酉，祿山陷東京，鼓噪自四門入，縱兵殺掠。次年正月，祿山於洛陽稱大燕皇帝。" />
