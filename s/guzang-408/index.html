    <title>姑臧之戰（禿髮傉檀破姚弼）（408年） · 華夏歷史輿圖</title>
    <meta name="description" content="姚興遣姚弼、斂成等率步騎三萬來伐。姚弼至姑臧，屯於西苑；傉檀遣俱延、敬歸等十將率騎分擊，大敗秦軍，斬首七千餘級。姚弼堅壁不出，傉檀斷其水源上流欲困之，適逢大雨堰壞，秦軍復振。" />
