    <meta name="description" content="趙簡子之子，名毋卹，代伯魯為太子而嗣立。圍鄭時受知伯之辱；知伯索地不與，被圍於晉陽，使張孟談約韓、魏，決水反灌知伯軍，殺知伯，三分其地。卒後傳位於伯魯之孫。" />
