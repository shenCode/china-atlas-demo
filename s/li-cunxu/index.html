    <meta name="description" content="名李存勗，沙陀人，晉王李克用之子。善戰，滅後梁、前蜀，建立後唐。晚年寵信伶人，自己也粉墨登場，取藝名「李天下」，政事敗壞，死於興教門之變。歐陽修在〈伶官傳序〉中以他為鑒：「憂勞可以興國，逸豫可以亡身。」" />
