    <title>濟南之戰（破邢杲）（528年） · 華夏歷史輿圖</title>
    <meta name="description" content="邢杲率河北流民十餘萬戶反於青州北海，自署漢王；永安元年十月李叔仁討之於濰水，失利而還。次年三月，北魏命上黨王元天穆與高歡征討，四月大破邢杲於齊州濟南，邢杲投降，送京師斬於都市。" />
