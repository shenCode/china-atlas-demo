    <title>趙鞅殺邯鄲午，范、中行氏攻趙（前497年） · 華夏歷史輿圖</title>
    <meta name="description" content="趙鞅向同族邯鄲午索要衛國所貢的五百家，要安置於晉陽；午先答應，後聽父兄之言而未即行。趙鞅怒，召午囚於晉陽，殺之；午子趙稷與涉賓以邯鄲叛。午是荀寅之甥，荀寅又與范吉射為姻親。秋七月，范氏、中行氏伐趙氏之宮，趙鞅奔晉陽，晉人圍之。" />
