    <title>黃巢入長安（880年） · 華夏歷史輿圖</title>
    <meta name="description" content="廣明元年十二月三日夜，唐僖宗從開遠門出逃，奔向駱谷；四日黃巢軍至昭應，金吾大將軍張直方率在京官員到灞上迎接；五日黃巢陷京師。入城時尚讓對圍觀百姓說：「黃王為生靈，不似李家不恤汝輩。」黃巢在長安稱帝，國號大齊，883年被唐軍與沙陀李克用逐出。" />
