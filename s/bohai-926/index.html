    <meta name="description" content="天顯元年，耶律阿保機親征渤海國，圍忽汗城（上京龍泉府），渤海王大諲譔素服牽羊，率僚屬三百餘人出降。阿保機改渤海為東丹國，以皇太子耶律倍為人皇王統治。同年阿保機在回師途中病死。" />
