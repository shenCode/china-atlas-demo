    <meta name="description" content="618年李淵受隋恭帝禪，即皇帝位於太極殿，改元武德。626年玄武門之變後李世民即位（太宗），630年李靖破突厥於陰山。690年武則天改國號為周，705年復唐。755年安祿山以誅楊國忠為名起兵，安史之亂後藩鎮割據。880年黃巢陷長安。" />
