    <title>唐玄宗（685–762年） · 華夏歷史輿圖</title>
    <meta name="description" content="名李隆基。開元年間國勢鼎盛。756年潼關失守，六月乙未凌晨出延秋門奔蜀；至馬嵬驛，諸衛頓軍不進，陳玄禮奏請誅楊國忠，楊貴妃亦被賜死。至成都。太子在靈武即位，尊其為太上皇；757年還長安，762年卒。" />
