    <meta name="description" content="建安十二年（207）曹操北征，七月大水，傍海道不通，田疇請為嚮導；曹軍出盧龍塞，塞外道絕不通，乃塹山堙谷五百餘里，經白檀，歷平岡，涉鮮卑庭，東指柳城。晉句注碑以盧龍與飛狐、句注並為北方之險。" />
