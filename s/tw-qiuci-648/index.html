    <title>阿史那社爾平龜茲（648年） · 華夏歷史輿圖</title>
    <meta name="description" content="貞觀二十二年，阿史那社爾既破處月、處密，引兵自焉耆之西趨龜茲北境，分兵五道，出其不意，焉耆王棄城奔龜茲。至多褐城，龜茲王訶利布失畢率眾五萬拒戰，敗走；社爾拔其都城，使安西都護郭孝恪守之。" />
