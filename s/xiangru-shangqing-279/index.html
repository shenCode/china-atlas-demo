    <meta name="description" content="澠池會罷歸國，趙王以相如功大，拜為上卿，位在廉頗之右。廉頗說：我為趙將，有攻城野戰之大功，相如只憑口舌，位反在我之上，且出身微賤，「吾羞，不忍為之下」，揚言見到相如必加羞辱。" />
