    <title>柴壁之戰（402年） · 華夏歷史輿圖</title>
    <meta name="description" content="天興五年五月，後秦主姚興遣其弟姚平率眾四萬來侵，攻陷平陽乾壁。北魏道武帝七月西征，八月至柴壁，姚平固守，魏軍圍之；姚興傾全國之兵來救。甲子，道武帝渡蒙坑迎擊，大破秦軍。十月姚平投水而死，餘眾三萬餘人被俘。" />
