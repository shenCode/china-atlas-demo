    <title>河橋之戰（538年） · 華夏歷史輿圖</title>
    <meta name="description" content="大統四年七月，東魏遣侯景、厙狄干、高敖曹、韓軌、可朱渾元、莫多婁貸文等圍西魏獨孤信於洛陽，高歡繼其後。宇文泰率軍救援，八月至穀城，臨陣斬莫多婁貸文，盡俘其眾。侯景等夜解圍，宇文泰率輕騎追至黃河邊；侯景北據河橋、南連邙山列陣迎戰。" />
