    <title>楊諒之亂（蒲州、高壁、清源）（604年） · 華夏歷史輿圖</title>
    <meta name="description" content="漢王楊諒為并州總管，自山以東至於滄海、南至黃河，五十二州皆隸屬之。隋文帝死後，楊諒受徵不赴，舉兵反，隋煬帝命楊素討之。楊諒遣茹茹天保據蒲州、燒斷河橋，楊素率輕騎五千自渭口夜渡，天明襲擊，天保敗走，王聃子以城降。" />
