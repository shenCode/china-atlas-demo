    <title>杯酒釋兵權（961年） · 華夏歷史輿圖</title>
    <meta name="description" content="宋太祖在晚朝後與石守信等禁軍大將飲酒，說做皇帝不如做節度使快樂，夜裡從未安枕；又說：「人孰不欲富貴，一旦有以黃袍加汝之身，雖欲不為，其可得乎？」勸他們「多積金、市田宅以遺子孫，歌兒舞女以終天年」。次日諸將皆稱病，請求解除兵權，太祖應允。" />
