    <title>指南魚與指南針（1044年） · 華夏歷史輿圖</title>
    <meta name="description" content="《武經總要》（1044年成書）記行軍辨向之法：用薄鐵葉剪成魚形，燒紅後使之帶磁，浮於水面即指南，稱「指南魚」。沈括《夢溪筆談》（約1088年）記方家「以磁石磨針鋒，則能指南，然常微偏東，不全南也」，並比較水浮、指爪、碗唇、縷懸四種放法。" />
