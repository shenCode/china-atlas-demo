    <meta name="description" content="大中二年沙州人張議潮起兵逐走吐蕃守將。大中五年他派兄長張義澤送上瓜、沙、伊、肅等十一州的戶籍，河西、隴右陷於吐蕃百餘年後重歸唐朝；唐以張議潮為瓜沙伊等州節度使，後號歸義軍。" />
