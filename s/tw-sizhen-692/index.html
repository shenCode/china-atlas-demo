    <title>王孝傑復安西四鎮（692年） · 華夏歷史輿圖</title>
    <meta name="description" content="安西四鎮久陷吐蕃。長壽元年，西州都督唐休璟請復取龜茲、于闐、疏勒、碎葉四鎮，武后以王孝傑為武威軍總管，與阿史那忠節將兵擊吐蕃。十月丙戌，大破吐蕃，復取四鎮，置安西都護府於龜茲，發兵戍之。" />
