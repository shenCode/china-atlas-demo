    <title>元嘉北伐（430）（430年） · 華夏歷史輿圖</title>
    <meta name="description" content="元嘉七年三月，宋文帝遣到彥之北伐，水軍入黃河。七月魏軍棄碻磝、滑臺而走，宋收復河南四鎮；但十月洛陽（金墉）、十一月虎牢相繼失陷。次年檀道濟救滑臺不及，滑臺陷落，宋軍退回。" />
