    <title>成都王穎、河間王顒之死，惠帝崩（306年） · 華夏歷史輿圖</title>
    <meta name="description" content="八王之亂的收場。成都王司馬穎被執，囚於鄴；十月，范陽王虓死，其長史劉輿恐穎為鄴人所附，秘不發喪，偽稱詔命，夜賜穎死，並殺其二子。十一月己巳夜，惠帝食餅中毒，庚午崩於顯陽殿，皇太弟熾即位，是為懷帝。" />
