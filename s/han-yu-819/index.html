    <meta name="description" content="元和十四年正月，憲宗派人到鳳翔法門寺迎佛指骨入宮供奉三日，再送各寺，王公百姓爭相施捨，甚至有人傾家蕩產、燒頂灼臂。刑部侍郎韓愈上〈論佛骨表〉諫阻，憲宗大怒欲處死，經眾人求情，貶為潮州刺史。" />
