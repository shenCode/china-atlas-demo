    <title>長平之戰（前262年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦、趙爭奪上黨，相持於長平。趙王以趙括代廉頗為將，趙括出擊，被秦軍包圍，突圍時被射殺，趙軍四十萬人投降。秦將白起（武安君）以為趙卒反覆，「乃挾詐而盡阬殺之」，只放回年幼者二百四十人；前後斬首虜四十五萬人，趙國大震。" />
