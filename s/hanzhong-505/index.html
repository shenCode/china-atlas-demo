    <title>邢巒取漢中（505年） · 華夏歷史輿圖</title>
    <meta name="description" content="梁梁、秦二州行事夏侯道遷以漢中降魏，北魏以邢巒都督征梁漢諸軍事，可便宜行事。韓多寶破梁將李天賜前軍於石亭，擒斬一千三百，李義珍討晉壽，王景胤夜遁；邢巒部將王足所向破敵，斬梁將樂保明等，又破范峻、孔陵於梓潼，殺傷投水死者萬餘人。" />
