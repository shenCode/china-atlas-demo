    <title>略陽之戰與光武親征隴右（32年） · 華夏歷史輿圖</title>
    <meta name="description" content="八年春，來歙與征虜將軍祭遵襲略陽，遵道病而還，分遣精兵隨歙，合二千餘人，伐山開道，從番須、回中直至略陽，斬隗囂守將金梁，據守其城。隗囂攻來歙，不能下。閏月，光武親征隗囂，竇融率河西五郡太守與車駕會於高平。" />
