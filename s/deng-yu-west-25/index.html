    <meta name="description" content="青犢、赤眉入函谷關攻更始，光武遣鄧禹率六裨將西進，以乘其亂。建武元年正月，鄧禹自箕關入河東，河東都尉閉關拒守，禹攻十日破之，獲輜重千餘乘，進圍安邑，數月未下；甲子，大破更始定國公王匡於安邑，斬其將劉均。" />
