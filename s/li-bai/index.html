    <meta name="description" content="字太白，號青蓮居士。少有逸才，志氣宏放。天寶初入長安，賀知章見而稱為「天上謫仙人」，玄宗召為翰林供奉，不久離京漫遊。安史之亂中入永王李璘幕府，永王兵敗後被判長流夜郎，中途遇赦東還，762年卒。" />
