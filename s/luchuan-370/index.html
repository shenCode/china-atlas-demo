    <title>潞川之戰（前秦滅前燕）（370年） · 華夏歷史輿圖</title>
    <meta name="description" content="太和五年，苻堅遣王猛率楊安、張蠔、鄧羌等十將、步騎六萬伐前燕：楊安攻晉陽，王猛攻壺關，所經郡縣皆降。慕容暐遣太傅慕容評率眾四十餘萬來救，慕容評畏王猛不敢進，屯於潞川；王猛遣郭慶率五千銳卒夜從間道繞至其營後，傍山縱火燒其輜重，火光見於鄴城。" />
