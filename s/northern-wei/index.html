    <title>北魏（386–534年） · 華夏歷史輿圖</title>
    <meta name="description" content="鮮卑拓跋珪386年即代王位於牛川，同年改稱魏王。398年都平城；太武帝滅夏、北燕、北涼，439年統一北方。孝文帝493年定遷都洛陽之計，推行漢化。六鎮之亂（524）後國勢瓦解，534年分裂為東、西魏。" />
