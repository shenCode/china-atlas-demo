    <meta name="description" content="西晉末年戰亂，北方士族與流民成批渡淮、渡江南下，聚居於京口、晉陵、廣陵、襄陽等地。東晉在其聚居處設立以北方州郡命名的僑州、僑郡、僑縣，如南徐州、南兗州、雍州，以安置流民。人口與文化重心自此南移。" />
