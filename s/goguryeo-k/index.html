    <title>高句麗（前38–668年） · 華夏歷史輿圖</title>
    <meta name="description" content="隋將宇文述率九軍至鴨綠水，糧盡。高句麗將文德見隋軍多饑色，每戰便北以疲之；述一日七戰皆捷，遂東渡薩水，距平壤城三十里。文德又遣使偽降，述見士卒疲敝、平壤險固，因其詐而還；半渡時高句麗擊其後軍，隋九軍大潰，一日一夜奔還鴨綠水。" />
