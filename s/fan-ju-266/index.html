    <meta name="description" content="魏人范雎入秦，說昭王：越韓、魏而攻齊，是借賊兵、齎盜糧，「王不如遠交而近攻，得寸則王之寸也，得尺亦王之尺也」。昭王四十一年（前266），廢太后，逐穰侯、高陵、華陽、涇陽君於關外，拜范雎為相，封於應，號應侯。" />
