    <title>玉壁之戰（542）（542年） · 華夏歷史輿圖</title>
    <meta name="description" content="王思政以玉壁地勢險要，請築城並親自規劃，移鎮於此。大統八年十月，高歡侵汾、絳，圍攻玉壁，王思政守禦有備，東魏晝夜攻圍不克；宇文泰出軍蒲坂，進至皂莢，高歡退兵，宇文泰渡汾追擊，高歡遁去。" />
