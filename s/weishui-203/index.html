    <title>濰水之戰（韓信破齊、斬龍且）（前204年） · 華夏歷史輿圖</title>
    <meta name="description" content="漢王已派酈食其說降齊，韓信仍聽蒯通之計渡河，乘齊不備，襲破齊歷下軍，直抵臨菑。齊王田廣以為酈生出賣自己，將其烹殺，逃往高密，向楚求救。韓信東追至高密西，楚派龍且率號稱二十萬之眾救齊。" />
