    <title>賈后誅楊駿（291年） · 華夏歷史輿圖</title>
    <meta name="description" content="八王之亂之始。三月辛卯夜，賈后與殿中中郎孟觀、李肇謀，啟惠帝作詔，誣太傅楊駿謀反，中外戒嚴。殿中兵燒駿府，駿逃於馬廄被殺；其弟珧、濟及黨羽皆夷三族，死者數千人。壬寅，徵汝南王司馬亮為太宰，與太保衛瓘輔政。" />
