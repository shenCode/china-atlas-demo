    <meta name="description" content="黃河渡口，唐人稱其河橋「通秦、晉之道」。漢二年（前205）魏王豹盛兵蒲阪、塞臨晉，韓信陳船佯渡臨晉，而從夏陽以木罌缻渡軍，襲安邑。建安十六年（211）曹操與馬超相持於潼關，潛遣徐晃、朱靈夜渡蒲阪津，據河西為營。" />
