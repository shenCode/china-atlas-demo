    <meta name="description" content="王世充擅權後厚賞將士、修治器械，盡出其眾與李密決戰。李密留王伯當守金墉，自率精兵至偃師，北阻邙山以待。王世充夜間偷渡，天明列陣，李密倉促出戰，大敗，率萬餘人奔洛口；偃師守將被部下所執，以城降。" />
