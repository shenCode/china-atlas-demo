    <title>柏陽之戰（姚興破乞伏乾歸）（400年） · 華夏歷史輿圖</title>
    <meta name="description" content="乞伏乾歸遷都苑川。後秦姚碩德率眾五萬自南安峽來伐，乾歸駐隴西拒之，姚興又暗中率軍繼進。乾歸遣慕容允率中軍二萬移屯柏陽，羅敦率外軍四萬移屯侯辰谷，自率輕騎數千窺探秦軍；忽遇大風昏霧，與中軍失散，為秦軍追騎所逼，退入外軍。" />
