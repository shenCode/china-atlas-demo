    <title>項羽擊齊（城陽之戰）（前205年） · 華夏歷史輿圖</title>
    <meta name="description" content="漢二年冬，項羽北至城陽，田榮迎戰敗走平原，為平原民所殺。項羽北焚齊國城郭屋舍，坑殺田榮降卒，擄掠老弱婦女，徇齊至北海，殘滅甚多，齊人相聚反叛。田榮弟田橫收齊散卒數萬，據城陽反抗，項羽連戰不能下——劉邦得以乘虛率五諸侯兵攻入彭城。" />
