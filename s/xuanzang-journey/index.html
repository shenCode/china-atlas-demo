    <title>玄奘西行（629年） · 華夏歷史輿圖</title>
    <meta name="description" content="玄奘認為當時佛經譯本多有訛謬，貞觀初隨商人西行求取原本。他經高昌、龜茲，越天山至碎葉，經中亞諸國南下印度，在那爛陀寺學法多年。「在西域十七年，經百余國」，645年回到長安，撰《大唐西域記》十二卷，並主持翻譯佛經。" />
