    <title>蔡州之戰（1233年） · 華夏歷史輿圖</title>
    <meta name="description" content="1233年金哀宗逃入蔡州，蒙古與南宋聯軍圍城。1234年正月，哀宗傳位於宗室完顏承麟，承麟即位後出城禦敵，南城已樹敵旗，敵軍四面殺入；哀宗自縊於幽蘭軒，末帝承麟為亂兵所殺，金亡。" />
