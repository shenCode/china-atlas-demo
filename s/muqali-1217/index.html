    <meta name="description" content="丁丑八月，成吉思汗封木華黎為太師、國王，命曰：「太行之北，朕自經略，太行以南，卿其勉之。」木華黎建行省於雲、燕，自燕南攻遂城、蠡州諸城，拔之；冬破大名府，東定益都、淄、登、萊、濰、密等州。" />
