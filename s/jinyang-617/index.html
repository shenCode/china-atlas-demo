    <title>李淵太原起兵（617年） · 華夏歷史輿圖</title>
    <meta name="description" content="甲子，唐公李淵起義師於太原，擊退來寇的突厥；李世民先下西河。七月李淵以元吉留守太原，率兵三萬西圖關中，駐賈胡堡，八月斬宋老生於霍邑，又下臨汾、絳郡，至龍門。李淵親圍河東，屈突通閉城自守，攻之不利而還；遂渡河舍於長春宮。" />
