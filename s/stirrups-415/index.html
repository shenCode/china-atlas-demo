    <title>雙馬鐙（北燕馮素弗墓）（415年） · 華夏歷史輿圖</title>
    <meta name="description" content="現存年代明確的最早一副雙馬鐙，出於北燕宰相馮素弗的墓中：木芯包鎏金銅片，一對。馮素弗卒於415年，墓在今遼寧北票，1965年發掘。更早的馬鐙只有單隻，供上馬踏腳之用，見於長沙西晉永寧二年（302）墓出土的陶騎俑。" />
