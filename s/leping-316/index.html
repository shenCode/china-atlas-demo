    <title>樂平之戰（劉琨失并州）（316年） · 華夏歷史輿圖</title>
    <meta name="description" content="石勒攻樂平，太守韓據向劉琨求救。劉琨以士眾新合，欲乘其銳氣以震懾石勒，不聽箕澹勸阻，悉發其眾，以箕澹率步騎二萬為前驅。石勒先據險要，設伏擊箕澹，大敗之，全軍覆沒，并州震駭；又遇大旱，劉琨窮蹙不能再守，遂應幽州刺史段匹磾之邀，率眾經飛狐入薊。" />
