    <meta name="description" content="吳將。建興元年十月會眾於東興，更作大堤，夾山築兩城，各留千人守之。魏命胡遵、諸葛誕等率眾七萬來攻兩塢，恪興軍四萬晨夜赴救。時天寒雪，魏諸將會飲，見吳前鋒兵少且解甲，不即嚴兵；吳兵登堤後鼓譟亂斫，魏軍驚走，爭渡浮橋，橋壞，自投於水，死者數萬。" />
