    <title>裘甫起事（浙東）（859年） · 華夏歷史輿圖</title>
    <meta name="description" content="大中十三年十二月，浙東裘甫攻陷象山，官軍屢敗，進逼剡縣，浙東騷動；次年陷剡，眾至數萬。朝廷以王式為浙東觀察使，式發諸道兵並用吐蕃、回鶻降騎，分路進討，圍甫於剡。甫出降，至越州，式斬其黨二十餘人，械甫送京師。" />
