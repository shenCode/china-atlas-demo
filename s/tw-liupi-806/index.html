    <title>高崇文平西川（劉闢）（806年） · 華夏歷史輿圖</title>
    <meta name="description" content="西川節度使韋皋卒，行軍司馬劉闢自為留後，又求兼領三川，發兵圍東川。憲宗用杜黃裳之議，元和元年命高崇文將兵討之。闢城鹿頭關，連八柵以拒；崇文屢破之，守將以城降，遂長驅成都，九月辛亥克之，檻闢送京師。憲宗裁抑藩鎮自此始。" />
