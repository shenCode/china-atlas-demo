    <title>唐滅高昌（640年） · 華夏歷史輿圖</title>
    <meta name="description" content="貞觀十四年，侯君集率軍滅麴氏高昌。大臣魏徵等諫阻在此設州駐兵，太宗不從，以其地置西州，又置安西都護府，留兵鎮守；屯兵可汗浮圖城的西突厥葉護畏懼來降，其地置為庭州。" />
