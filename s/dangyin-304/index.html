    <title>蕩陰之戰（惠帝北征被擄）（304年） · 華夏歷史輿圖</title>
    <meta name="description" content="七月朔，右衛將軍陳眕以詔召百官入殿，勒兵討伐據鄴的成都王司馬穎；司徒王戎、東海王司馬越等奉惠帝北征，至安陽時眾十餘萬。司馬穎遣石超迎戰，己未六軍敗績於蕩陰，箭矢及於御車，百官四散，侍中嵇紹死之；惠帝面頰受傷、身中三箭，失落六璽。" />
