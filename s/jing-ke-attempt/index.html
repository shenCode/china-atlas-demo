    <title>荊軻刺秦王（前227年） · 華夏歷史輿圖</title>
    <meta name="description" content="燕太子丹派荊軻入秦行刺。太子與賓客白衣冠送至易水之上，高漸離擊筑，荊軻和而歌：「風蕭蕭兮易水寒，壯士一去兮不復還！」荊軻在咸陽宮獻督亢地圖，圖窮匕見，刺秦王不中，被殺。次年秦攻破燕都薊。" />
