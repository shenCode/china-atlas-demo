    <title>杜甫（712–770年） · 華夏歷史輿圖</title>
    <meta name="description" content="字子美，本襄陽人，後徙河南鞏縣。天寶年間應試不第，長期困居長安；安史之亂中陷於叛軍，後逃奔肅宗。759年入蜀，在成都浣花溪畔築草堂。765年後順江東下，漂泊荊湘，卒於湘江舟中。後世尊為「詩聖」，其詩被稱為「詩史」。" />
