    <title>竊符救趙（前257年） · 華夏歷史輿圖</title>
    <meta name="description" content="意為冒險用非常手段救人之急。秦圍邯鄲，魏王畏秦，令晉鄙之軍止於鄴。信陵君用侯嬴之計，請魏王寵姬如姬從王的臥內盜出調兵的虎符，持符至軍；晉鄙生疑，朱亥以鐵椎擊殺之，信陵君遂奪其軍，進擊秦軍，邯鄲之圍得解。" />
