    <title>宋滅南唐（974年） · 華夏歷史輿圖</title>
    <meta name="description" content="宋軍自荊湖沿江東下，在采石架設浮橋渡過長江，圍金陵近一年。開寶八年十一月城破，南唐後主李煜出降。此前宋已滅荊南、湖南（963）、後蜀（965）、南漢（971）；其後吳越納土（978），北漢亡（979）。" />
