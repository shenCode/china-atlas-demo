    <title>洺水之戰（唐平劉黑闥）（622年） · 華夏歷史輿圖</title>
    <meta name="description" content="竇建德舊將劉黑闥復起，盡有河北。武德五年正月，秦王李世民取相州，進軍肥鄉，列營洺水之上。世民度黑闥糧盡必來決戰，預堰洺水上流；及戰，守吏決堰，水深丈餘，黑闥眾大潰，斬首萬餘級，溺死數千人，黑闥奔突厥。" />
