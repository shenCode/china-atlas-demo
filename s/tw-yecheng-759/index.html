    <title>鄴城之戰（九節度兵潰）（759年） · 華夏歷史輿圖</title>
    <meta name="description" content="九節度之師圍安慶緒於鄴，久不下。乾元二年三月壬申，官軍步騎六十萬陳於安陽河北，史思明自將精兵五萬來戰。郭子儀承其後，未及布陣，大風忽起，吹沙拔木，天地晝晦，咫尺不相辨；兩軍大驚，官軍潰而南，叛軍潰而北，甲仗輜重委積於路。" />
