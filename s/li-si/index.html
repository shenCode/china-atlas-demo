    <meta name="description" content="楚國上蔡人，師從荀子，入秦為客卿。秦王下令驅逐客卿時上〈諫逐客書〉：「太山不讓土壤，故能成其大；河海不擇細流，故能就其深」，秦王收回逐客令。後任丞相，主張郡縣制、焚書、統一文字。始皇死後與趙高偽造詔書立胡亥，後為趙高所害，腰斬於咸陽。" />
