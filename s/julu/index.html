    <title>鉅鹿之戰（前207年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦將王離圍趙王於鉅鹿。項羽殺上將軍宋義（卿子冠軍）後，率楚軍全部渡河，「皆沈船，破釜甑，燒廬舍，持三日糧」，以示必死。楚軍包圍王離，九戰，斷絕秦軍甬道，大破之，殺蘇角，俘王離；涉閒自焚而死。從此楚兵冠於諸侯。" />
