    <title>劉裕滅南燕（409年） · 華夏歷史輿圖</title>
    <meta name="description" content="南燕主慕容超屢次侵掠淮北。義熙五年劉裕北伐，南燕不守大峴山之險，劉裕越過大峴時舉手指天說：「吾事濟矣！」隨後在臨朐大敗燕軍，圍廣固，410年二月破城，擒慕容超送建康斬首，南燕亡。" />
