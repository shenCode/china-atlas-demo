    <title>六鎮之亂（524年） · 華夏歷史輿圖</title>
    <meta name="description" content="正光五年三月，沃野鎮人破落汗拔陵聚眾反，殺鎮將，北邊六鎮相繼響應。北魏遷洛後邊鎮軍人地位低落，積怨爆發。亂事延燒十餘年，爾朱榮、高歡、宇文泰皆由此崛起，北魏終於分裂。" />
