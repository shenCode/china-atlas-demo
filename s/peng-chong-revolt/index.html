    <title>彭寵之亂（26年） · 華夏歷史輿圖</title>
    <meta name="description" content="漁陽太守彭寵反，自將二萬餘人攻幽州牧朱浮於薊，分兵徇廣陽、上谷、右北平。光武遣游擊將軍鄧隆救朱浮，與寵戰於潞，隆軍敗績。次年春，寵拔右北平、上谷數縣，陷薊城，自立為燕王；又以美女繒綵賂遺匈奴，單于遣左南將軍七八千騎往來為游兵以助寵。" />
