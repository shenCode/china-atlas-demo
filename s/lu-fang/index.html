    <meta name="description" content="起兵安定。建武五年，李興、閔堪至單于庭迎芳入塞，都九原，掠有五原、朔方、雲中、定襄、鴈門五郡，與胡通兵，侵苦北邊；十二月自稱天子。其所置朔方、雲中太守後舉郡降漢。終自五原亡入匈奴（本紀繫於十三年，〈盧芳傳〉繫於十二年）。" />
