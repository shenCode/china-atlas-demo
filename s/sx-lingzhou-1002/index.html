    <title>李繼遷陷靈州（1002年） · 華夏歷史輿圖</title>
    <meta name="description" content="党項李繼遷自太平興國中叛宋，據夏、銀諸州，屢斷靈州糧道。咸平五年三月，大集蕃部攻陷靈州，知州裴濟死之；繼遷改靈州為西平府而都之。宋失西北重鎮與河西之路，西夏立國之基始定；三十六年後其孫元昊稱帝。" />
