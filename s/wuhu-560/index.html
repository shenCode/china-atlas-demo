    <title>蕪湖之戰（侯瑱破王琳）（560年） · 華夏歷史輿圖</title>
    <meta name="description" content="王琳東下至柵口，陳以侯瑱為大都督出屯蕪湖，侯安都多所謀劃。天嘉元年二月，東關春水漸漲，舟艦得以通行，侯瑱進軍獸檻洲，王琳列船於江西，隔洲相對。北齊儀同劉伯球率萬餘人助王琳水戰，慕容子會率鐵騎二千屯蕪湖西岸博望山南為聲援。" />
