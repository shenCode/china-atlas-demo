    <title>秦之銳士（前306年） · 華夏歷史輿圖</title>
    <meta name="description" content="《荀子·議兵》以三國之兵相較：「齊之技擊，不可以遇魏氏之武卒；魏氏之武卒，不可以遇秦之銳士。」秦人生計窮隘，上以賞罰驅之，要得利只有從戰，斬五甲首而隸五家，所以「四世有勝，非幸也，數也」。《漢書·刑法志》說「秦昭以銳士勝」。" />
