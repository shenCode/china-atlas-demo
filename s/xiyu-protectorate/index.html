    <title>西域都護（前60年） · 華夏歷史輿圖</title>
    <meta name="description" content="神爵二年，匈奴日逐王背叛單于，率眾降漢，護鄯善以西使者鄭吉迎接。漢封日逐王為歸德侯、鄭吉為安遠侯，並使鄭吉兼護北道，號為都護——「都護之起，自吉置矣」。匈奴的僮僕都尉因此撤銷，匈奴勢力退出西域。" />
