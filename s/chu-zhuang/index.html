    <meta name="description" content="名侶（一作旅），春秋五霸之一。即位之初三年不出號令，大臣伍舉以「有鳥三年不蜚不鳴」相諫，他答以「三年不蜚，蜚將沖天；三年不鳴，鳴將驚人」，此後整頓政事。曾陳兵周郊、問鼎輕重，前597年在邲之戰大敗晉軍。" />
