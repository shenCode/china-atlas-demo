    <title>梁田陂之戰（李克用收復長安）（883年） · 華夏歷史輿圖</title>
    <meta name="description" content="中和三年二月，黃巢將尚讓等率十五萬眾屯於梁田陂；次日大戰，自午至晡，巢軍大敗，俘斬數萬，伏屍三十里。巢兵數敗，食盡，陰為遁計，發兵三萬扼藍田道。四月甲辰，李克用等自光泰門入京師，巢力戰不勝，焚宮室遁去。" />
