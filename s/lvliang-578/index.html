    <meta name="description" content="陳將吳明徹北伐，進至呂梁，北周徐州總管梁士彥出戰不利，退守徐州，不敢再出。吳明徹堰清水灌城，環列舟艦於城下急攻。北周遣王軌來救，王軌自清水入淮口，在水中豎木，以鐵鎖貫連車輪，截斷陳軍船路。" />
