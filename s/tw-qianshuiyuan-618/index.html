    <title>淺水原之戰（唐平薛仁果）（618年） · 華夏歷史輿圖</title>
    <meta name="description" content="隴右薛舉東逼長安。七月壬子，舉潛師掩唐軍之後，戰於淺水原，唐八總管皆敗，士卒死者什五六，秦王李世民引兵還長安。舉旋死，子仁果立，復圍涇州。十一月，世民再出，仁果計窮，己酉出降，唐得其精兵萬餘人、男女五萬口，隴右平。" />
