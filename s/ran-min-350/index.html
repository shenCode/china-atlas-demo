    <title>冉閔殺胡（350年） · 華夏歷史輿圖</title>
    <meta name="description" content="後趙末年大亂，漢人將領冉閔（石虎養孫）掌握鄴城，下令城內趙人斬一胡首送鳳陽門者，文官進位三等，武職悉拜牙門，一日之中斬首數萬，屠殺胡羯不分男女老少二十餘萬人。不久冉閔稱帝，國號魏。" />
