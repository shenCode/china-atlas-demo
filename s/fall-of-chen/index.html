    <title>隋滅陳（588年） · 華夏歷史輿圖</title>
    <meta name="description" content="開皇八年冬，隋以晉王楊廣節度諸軍，總管九十、兵五十一萬八千，東至海、西至巴蜀，同時伐陳。次年正月賀若弼自廣陵渡江取京口，韓擒虎自橫江渡采石，入建康，俘陳後主，陳亡。南北分裂近三百年，至此復歸統一。" />
