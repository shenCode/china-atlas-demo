    <title>五國攻秦至函谷，楚為從長（前241年） · 華夏歷史輿圖</title>
    <meta name="description" content="楚、趙、魏、韓、燕（一作衛）合從伐秦，楚考烈王為從長，春申君主其事，取壽陵。兵至函谷，秦師出關，五國之師皆敗走。楚王因此歸咎春申君，春申君從此日益疏遠。這是六國最後一次合縱攻秦；同年楚東徙都壽春。" />
