    <title>石勒襲薊（擒王浚）（314年） · 華夏歷史輿圖</title>
    <meta name="description" content="石勒以輕騎襲幽州，夜間舉火行軍。王浚將佐皆請出擊，王浚以為石勒前來奉戴自己，下令「敢言擊者斬」，設宴相待。石勒清晨至薊，令守門者開門，又先驅牛羊數千頭聲稱獻禮，實欲堵塞街巷使守軍不得出動；隨即登廳，命甲士執王浚，送至襄國斬於市。" />
