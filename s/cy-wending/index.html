    <title>問鼎（前606年） · 華夏歷史輿圖</title>
    <meta name="description" content="意為圖謀奪取政權，後也指爭奪最高的地位。楚莊王伐陸渾之戎，至於雒，在周的疆界上陳兵。周定王使王孫滿勞軍，楚王「問鼎之大小輕重焉」。九鼎是王權的象徵；王孫滿答：「在德不在鼎……周德雖衰，天命未改。鼎之輕重，未可問也。」" />
