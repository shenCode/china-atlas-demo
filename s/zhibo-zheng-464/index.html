    <title>知伯圍鄭，辱趙襄子（前464年） · 華夏歷史輿圖</title>
    <meta name="description" content="晉荀瑤（知伯）帥師圍鄭，入南里，攻桔柣之門。將攻門，知伯命趙孟（趙襄子，時為趙簡子太子）先入，趙孟說：「主在此。」知伯說：「惡而無勇，何以為子？」趙孟答：「以能忍恥，庶無害趙宗乎？" />
