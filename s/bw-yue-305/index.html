    <title>東海王越起兵迎駕（305年） · 華夏歷史輿圖</title>
    <meta name="description" content="八王之第八王。惠帝為張方劫至長安，在河間王顒手中。永興二年（305）七月，東海王司馬越傳檄山東，稱糾率義旅，奉迎天子；范陽王虓、王浚等推越為盟主。越率甲士三萬西屯蕭縣，虓自許屯滎陽。" />
