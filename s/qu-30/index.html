    <title>朐之圍（董憲、龐萌之亡）（29年） · 華夏歷史輿圖</title>
    <meta name="description" content="吳漢再拔郯，董憲與龐萌走保朐，吳漢進圍之。次年城中穀盡，憲、萌潛出，襲取贛榆，琅邪太守陳俊攻之，憲、萌走入澤中。二月，吳漢拔朐。本紀記「獲董憲、龐萌，山東悉平」；〈劉永傳〉記吳漢校尉韓湛追斬憲於方與，方與人黔陵亦斬萌，皆傳首洛陽。" />
