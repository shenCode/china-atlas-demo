    <title>南牀山之戰（391年） · 華夏歷史輿圖</title>
    <meta name="description" content="登國六年十月，拓跋珪北征柔然，柔然移部遁走，魏軍追及於大磧南牀山下，大破之，俘其半部。匹候跋及部帥屋擊各收餘眾遁走，長孫嵩、長孫肥渡磧追擊：長孫嵩至平望川大破屋擊，擒而斬之；長孫肥追匹候跋至涿邪山，匹候跋舉部請降。" />
