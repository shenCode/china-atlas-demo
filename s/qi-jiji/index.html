    <title>齊之技擊（前301年） · 華夏歷史輿圖</title>
    <meta name="description" content="《荀子·議兵》：「齊人隆技擊，其技也，得一首者，則賜贖錙金，無本賞矣。」只按斬首給賞，不問勝負；荀子說這種兵遇小敵可用，遇大敵堅陣就渙然離散，「是亡國之兵也」。《漢書·刑法志》說「齊愍以技擊彊」。" />
