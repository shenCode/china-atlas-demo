    <title>弘農之戰（537年） · 華夏歷史輿圖</title>
    <meta name="description" content="大統三年八月，宇文泰率李弼、獨孤信、于謹等十二將東伐，至弘農，東魏將高干與陝州刺史李徽伯拒守。時值連雨，宇文泰命諸軍冒雨攻城，庚寅城潰，斬李徽伯，俘戰士八千；高干渡河而逃，為賀拔勝追擒。宜陽、邵郡相繼來歸。" />
