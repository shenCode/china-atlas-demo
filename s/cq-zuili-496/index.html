    <title>檇李之戰（闔閭傷死）（前496年） · 華夏歷史輿圖</title>
    <meta name="description" content="吳王闔廬十九年夏，聞越王允常死，伐越。越王句踐迎擊於檇李，使死士三行至吳陣前呼而自剄，吳師觀之，越因襲擊，吳師敗，闔廬傷指，軍卻七里而卒。子夫差立，誓報越，三年後敗越於夫椒。" />
