    <meta name="description" content="秦孝公卒，太子立，是為惠文君。公子虔之徒告商君欲反，發吏捕之。商君逃到關下，欲宿客舍，舍人說：「商君之法，舍人無驗者坐之。」他歎道：「為法之敝一至此哉！」逃往魏國，魏人恨他欺公子卬，不受，送回秦境。" />
