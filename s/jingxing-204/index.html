    <meta name="description" content="韓信率數萬漢軍東出井陘擊趙。他先派萬人背靠綿蔓水列陣，趙軍見了大笑；又派二千輕騎繞到趙營後方。趙軍傾巢出擊不能取勝，回營時見營壘已插滿漢軍赤旗，大亂潰敗，趙王歇被俘。" />
