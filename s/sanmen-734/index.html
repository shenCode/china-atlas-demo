    <title>裴耀卿置倉轉運，鑿漕渠十八里以避三門（734年） · 華夏歷史輿圖</title>
    <meta name="description" content="開元二十二年，玄宗以裴耀卿為江淮、河南轉運使，在汴河入黃河之口置輸場。八月壬寅，在輸場之東置河陰倉、西置柏崖倉，三門之東置集津倉、西置鹽倉，「鑿漕渠十八里，以避三門之險」：江淮之粟逐段轉運，至三門則陸運繞過，再入河、渭抵長安。" />
