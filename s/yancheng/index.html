    <title>郾城之戰（1140年） · 華夏歷史輿圖</title>
    <meta name="description" content="紹興十年金軍毀約南下，岳飛出兵北伐，所遣諸將相繼報捷。大軍駐潁昌，岳飛自率輕騎駐郾城。兀朮（完顏宗弼）認為諸帥易與、唯岳飛難敵，便集中兵力來攻郾城，被岳飛擊敗。不久宋廷連發金字牌命其班師。" />
