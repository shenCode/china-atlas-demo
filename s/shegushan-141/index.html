    <title>射姑山之戰（141年） · 華夏歷史輿圖</title>
    <meta name="description" content="永和五年夏，且凍、傅難等種羌反，攻金城，與西塞及湟中諸羌胡大寇三輔。次年春正月，征西將軍馬賢率五六千騎擊之，至射姑山兵敗，馬賢及二子皆戰歿，安定太守郭璜下獄死。此後東西羌大合，鞏唐種三千餘騎寇隴西，燒園陵，掠關中。射姑山確切位置不詳。" />
