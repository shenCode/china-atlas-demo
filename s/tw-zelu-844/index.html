    <meta name="description" content="昭義（澤潞）節度使劉從諫卒，其姪稹秘喪，逼監軍奏請以己為留後。武宗用李德裕之策，不許，命成德王元逵、魏博何弘敬與河陽、河東諸軍討之，使河北兩鎮攻其山東三州。會昌四年八月，邢、洺、磁三州降；潞人大懼，大將郭誼殺稹以降。" />
