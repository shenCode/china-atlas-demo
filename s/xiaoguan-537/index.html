    <title>小關之戰（宇文泰斬竇泰）（537年） · 華夏歷史輿圖</title>
    <meta name="description" content="大統三年正月，東魏三路來攻：高歡屯軍蒲坂，造三道浮橋渡河，竇泰趨潼關，高敖曹圍洛州。宇文泰率騎六千回長安，揚言保守隴右，隨即暗中出兵，癸丑清晨抵小關。竇泰驚慌，依山列陣，未及成列，宇文泰縱兵擊破之，盡俘其眾萬餘人，斬竇泰，傳首長安。" />
