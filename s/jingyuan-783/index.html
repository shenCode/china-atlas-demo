    <meta name="description" content="建中四年十月，涇原軍奉命東援襄城，途經長安時在滻水嘩變，姚令言無法約束。德宗急召神策軍護駕，竟無一人應召，只得與太子、諸王及妃主百餘人出苑北門出逃，經咸陽奔奉天。叛軍擁立朱泚稱帝，次年唐軍才收復長安。" />
