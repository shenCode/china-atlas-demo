    <title>假道伐虢（晉滅虢、虞）（前658年） · 華夏歷史輿圖</title>
    <meta name="description" content="晉獻公使荀息以屈產之乘假道於虞以伐虢，取下陽。二十二年復假道，宮之奇諫虞君曰「脣亡則齒寒」，不聽，以其族去虞。其冬晉滅虢，虢公丑奔周；還，襲滅虞，虜虞公及大夫百里奚。" />
