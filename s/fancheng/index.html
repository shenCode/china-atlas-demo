    <title>樊城之戰（219年） · 華夏歷史輿圖</title>
    <meta name="description" content="建安二十四年，關羽北攻曹仁於樊城。秋，大霖雨，漢水汎溢，于禁所督七軍皆沒，禁降；羽威震華夏，曹操一度議遷許都。呂蒙乘虛，使兵士扮作商人渡江，襲取江陵、公安；羽軍潰散，退保麥城，於臨沮被殺。孫劉聯盟至此破裂。" />
