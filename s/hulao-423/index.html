    <title>虎牢之戰（422年） · 華夏歷史輿圖</title>
    <meta name="description" content="永初三年十月，北魏明元帝拓跋嗣遣奚斤、公孫表等率步騎二萬餘人自石濟南渡黃河；十一月猛攻滑臺，滑臺陷落。魏軍隨即圍攻宋司州刺史毛德祖所守的虎牢。虎牢被圍二百日，無日不戰，毛德祖於被撞毀的外城內更築三重城牆，將士眼皆生創，死者過半，眾無離心。" />
