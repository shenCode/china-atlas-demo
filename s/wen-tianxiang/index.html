    <title>文天祥（1236–1282年） · 華夏歷史輿圖</title>
    <meta name="description" content="吉州廬陵人，1256年狀元。元兵南下時起兵勤王，任右丞相。1278年在五坡嶺兵敗被俘。元將張弘範要他寫信招降張世傑，他書所過《零丁洋詩》與之，末云「人生自古誰無死，留取丹心照汗青」。崖山破後被押往大都，囚禁三年不屈，就義於大都。" />
