    <title>廣固之圍（慕容恪破段龕）（355年） · 華夏歷史輿圖</title>
    <meta name="description" content="段蘭之子段龕乘冉閔之亂擁眾東屯廣固，自號齊王，向東晉稱藩，致書慕容儁以平等相稱。慕容儁遣慕容恪、慕容塵討之。段龕之弟段羆力請出戰，段龕怒而斬之，自率三萬人迎戰，慕容恪於濟水之南大敗之，斬其弟段欽，盡俘其眾。" />
