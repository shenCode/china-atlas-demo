    <title>安西四鎮（648年） · 華夏歷史輿圖</title>
    <meta name="description" content="唐太宗攻破龜茲後，把安西都護府遷到龜茲都城，以郭孝恪為都護，兼統于闐、疏勒、碎葉，稱為「四鎮」。高宗時一度放棄四鎮、把安西移回西州；其後吐蕃大舉進入，焉耆以西四鎮城堡都被攻陷。四鎮此後幾經得失，8世紀末終為吐蕃所有。" />
