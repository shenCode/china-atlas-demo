    <title>壺頭之役（馬援征五溪）（48年） · 華夏歷史輿圖</title>
    <meta name="description" content="馬援率中郎將馬武、耿舒等，將十二郡募士及弛刑四萬餘人征五溪。軍至下雋，有兩道：經壺頭路近而水險，經充路平而運遠；耿舒主張走充道，馬援認為不如進壺頭扼其咽喉，光武帝從馬援之策。" />
