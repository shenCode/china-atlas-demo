    <meta name="description" content="嫪毐之亂牽連呂不韋，秦王政免其相位，令就國河南。歲餘，諸侯賓客使者相望於道，秦王恐其為變，賜書責問：君何功於秦，何親於秦？「其與家屬徙處蜀！」呂不韋自度漸被侵逼，恐誅，乃飲酖而死。" />
