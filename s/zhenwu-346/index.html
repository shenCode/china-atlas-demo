    <title>振武之戰（謝艾初破麻秋）（346年） · 華夏歷史輿圖</title>
    <meta name="description" content="後趙石虎遣王擢、麻秋、孫伏都等侵寇前涼不止，金城太守張沖降於麻秋，涼州震動。主簿謝艾被舉薦為「兼資文武，明識兵略」，張重華以其為中堅將軍，配步騎五千擊麻秋。謝艾引兵出振武，夜有二梟鳴於營中，謝艾以為克敵之兆，進戰大破趙軍，斬首五千級。" />
