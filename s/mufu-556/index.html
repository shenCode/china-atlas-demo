    <title>莫府山之戰（陳霸先大破北齊）（556年） · 華夏歷史輿圖</title>
    <meta name="description" content="太平元年三月，北齊遣蕭軌、厙狄伏連、東方老、裴英起、李希光等率水軍南下；六月齊兵潛至鍾山龍尾，進至莫府山。陳霸先遣錢明率水軍截擊齊軍糧運，盡獲其船米，齊軍大饑，殺馬驢而食。" />
