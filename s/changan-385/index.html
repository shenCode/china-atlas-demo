    <title>長安之陷與苻堅之死（384年） · 華夏歷史輿圖</title>
    <meta name="description" content="慕容沖率眾攻長安，苻堅親自披甲督戰，飛矢滿身，血流被體；慕容沖毒暴關中，人民流散，千里無煙。苻堅遣衛將軍楊定擊沖於城西，楊定被擒，苻堅大懼，將後事付與太子苻宏，率騎數百出奔五將山；苻宏隨後亦出奔，百官逃散，慕容沖入據長安，縱兵大掠。" />
