    <meta name="description" content="陳勝遣周文西擊秦，周文沿途收兵，至函谷關時已有車千乘、卒數十萬，進至戲。秦令少府章邯赦免酈山刑徒及奴隸之子，悉數發兵迎擊，大敗楚軍。周文敗走出關，駐於曹陽二三月，章邯追擊再敗之。" />
