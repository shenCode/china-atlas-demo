    <title>壺關之戰（曹操破高幹）（206年） · 華夏歷史輿圖</title>
    <meta name="description" content="袁紹之甥高幹曾領并州牧，曹操攻克鄴城後高幹投降，仍任刺史；聞曹操北討烏丸，高幹以并州叛，執上黨太守，舉兵據守壺關口，樂進、李典擊之，高幹退守壺關城。建安十一年正月，曹操親征，高幹留別將守城，自往匈奴求救，單于不受。" />
