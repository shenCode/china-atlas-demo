    <title>齊、韓、魏攻秦，入函谷（前298年） · 華夏歷史輿圖</title>
    <meta name="description" content="孟嘗君歸相齊，齊與韓、魏共擊秦於函谷，《六國年表》記是年「河、渭絕一日」。兵連三年；前296年，齊、韓、魏、趙、宋同擊秦，至鹽氏而還，秦歸還韓的武遂、魏的封陵以求和。這是山東諸國少有的攻入函谷關的一役。" />
