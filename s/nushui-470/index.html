    <title>女水之戰（改名武川）（470年） · 華夏歷史輿圖</title>
    <meta name="description" content="皇興四年，柔然予成犯塞，北魏獻文帝北討，諸將會於女水之濱。獻文帝誓眾，稱「用兵在奇不在眾」，選精兵五千人挑戰，多設奇兵迷惑敵軍。柔然奔潰，魏軍追擊三十餘里，斬首五萬級，降者萬餘人。往返六千餘里，歷時十九日，改女水為武川，刻石紀功。" />
