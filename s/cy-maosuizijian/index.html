    <meta name="description" content="意為自告奮勇，自己推薦自己。秦圍邯鄲，平原君要帶二十名門客往楚求救，只選得十九人。門下毛遂「自贊於平原君」。平原君說賢士如錐處囊中，其末立見，而先生在此三年無所聞。毛遂答：「臣乃今日請處囊中耳。使遂蚤得處囊中，乃穎脫而出，非特其末見而已。" />
