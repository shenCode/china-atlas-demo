    <title>潼關（211年） · 華夏歷史輿圖</title>
    <meta name="description" content="漢末代函谷關而起。據《元和郡縣圖志》，初平二年（191）關尚在新安，建安十六年（211）曹操破馬超已在潼關。其地即古桃林塞，關西一里有潼水，因以名關。天寶十四載（755）安祿山陷東京，封常清勸高仙芝棄陝州，「急保潼關」。" />
