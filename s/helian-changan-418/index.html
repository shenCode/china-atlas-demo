    <title>赫連勃勃取長安（青泥之戰）（418年） · 華夏歷史輿圖</title>
    <meta name="description" content="劉裕滅後秦後東歸，留其子劉義真鎮長安。赫連勃勃用王買德之策，以子赫連璝率騎二萬南伐長安，赫連昌屯兵潼關，王買德南斷青泥，勃勃率大軍繼發。劉裕大懼，召義真東鎮洛陽，以朱齡石守長安。義真大掠而東，至灞上，長安百姓驅逐朱齡石，迎勃勃入城。" />
