    <meta name="description" content="指受擁戴而登帝位，也泛指政變奪權成功。後周顯德七年正月，趙匡胤率軍北禦契丹，宿陳橋驛。黎明，將士擐甲執兵直入寢所，說諸將無主，願奉太尉為天子；未及回答，「有以黃衣加太祖身，眾皆羅拜，呼萬歲」。遂還京師，代周為宋。" />
