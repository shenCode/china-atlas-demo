    <meta name="description" content="意為微不足道的技能，也指有這類本事的人。孟嘗君被秦昭王囚禁，求救於王的幸姬，姬要已獻給秦王的狐白裘。門客中居末座者「有能為狗盜者」，夜入秦宮盜裘以獻。孟嘗君得釋，夜半馳至函谷關，「關法雞鳴而出客」，客中有能學雞鳴的，群雞齊鳴，遂得出關。" />
