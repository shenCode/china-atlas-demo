    <meta name="description" content="北齊大將。北周與突厥合兵逼晉陽，齊軍在大雪後以逸待勞，大破之，段韶率騎追擊出塞。周軍尉遲迥等圍洛陽，段韶督精騎一千自晉陽南下，五日渡河，與蘭陵王高長恭、斛律光分為左、中、右三軍，於邙山以騎誘步，待周軍力疲而擊之，周軍大潰，洛陽之圍遂解。" />
