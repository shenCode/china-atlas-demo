    <title>匡亭之戰（曹操逐袁術）（193年） · 華夏歷史輿圖</title>
    <meta name="description" content="初平四年春，劉表截斷袁術糧道，袁術率軍入陳留，屯封丘，派劉詳屯匡亭。曹操擊劉詳，袁術來救，曹操大破之。袁術退保封丘，被圍，未合圍即逃往襄邑，曹操追至太壽，決渠水灌城；袁術又逃往寧陵，再被追擊，遂逃往九江。" />
