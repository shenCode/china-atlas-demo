    <title>大澤鄉起義（前209年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦二世元年七月，陳勝、吳廣率戍卒北上戍邊，在大澤鄉遇雨誤期，按秦法當斬。陳勝殺死押送的兩名將尉，號召眾人：「王侯將相寧有種乎！」詐稱公子扶蘇、項燕，袒右臂，稱大楚，築壇盟誓，攻下大澤鄉和蘄縣。天下響應，秦朝隨之崩潰。" />
