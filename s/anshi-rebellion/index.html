    <title>安史之亂（755年） · 華夏歷史輿圖</title>
    <meta name="description" content="天寶十四載十一月丙寅，范陽節度使安祿山率蕃、漢之兵十餘萬自幽州南下，以誅楊國忠為名起兵。叛軍攻陷洛陽，次年破潼關、陷長安，玄宗奔蜀。安祿山、史思明父子相繼稱帝，戰亂延續八年，763年史朝義兵敗自殺才告平定。" />
