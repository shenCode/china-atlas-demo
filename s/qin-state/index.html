    <title>秦（前770–前222年） · 華夏歷史輿圖</title>
    <meta name="description" content="起於隴右與關中西部。秦穆公用由余之謀伐戎王，「益國十二，開地千里，遂霸西戎」。秦孝公以衛鞅為左庶長，定變法之令：什伍連坐、軍功授爵、獎勵耕織。前350年遷都咸陽。此後東出兼併六國，前221年秦王政統一天下。" />
