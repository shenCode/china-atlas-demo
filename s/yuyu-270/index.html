    <title>閼與之戰（前270年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦軍圍閼與，趙奢率趙軍往救，先據北山，大破秦軍，閼與圍解。此前趙王問救否，廉頗、樂乘皆言道遠險狹難救；趙奢曰：「其道遠險狹，譬之猶兩鼠鬥於穴中，將勇者勝。」王乃令趙奢將。奢發萬人先據北山，秦兵後至，爭山不得上。趙惠文王賜奢號馬服君。" />
