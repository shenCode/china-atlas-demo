    <meta name="description" content="齊文襄遣慕容紹宗追擊侯景，侯景退入渦陽，尚有馬數千匹、甲卒數萬、車萬餘輛，與紹宗相持於渦水之北。侯景軍糧盡，士卒皆北人，不願南渡，其將暴顯等率部投降紹宗，侯景軍遂潰散。侯景僅與親信數騎自峽石渡淮，收得散卒八百人，奔壽春，監州韋黯納之。" />
