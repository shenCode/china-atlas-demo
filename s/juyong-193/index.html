    <title>居庸之戰（公孫瓚擒劉虞）（193年） · 華夏歷史輿圖</title>
    <meta name="description" content="幽州牧劉虞恐公孫瓚作亂，舉兵襲之，反為公孫瓚所敗，出奔居庸。公孫瓚攻拔居庸，生擒劉虞帶回薊城。其後朝廷遣使者段訓增劉虞封邑，公孫瓚誣劉虞欲稱尊號，脅迫段訓斬之。" />
