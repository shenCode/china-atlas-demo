    <title>開通濟渠（605年） · 華夏歷史輿圖</title>
    <meta name="description" content="大業元年三月，隋煬帝發河南諸郡男女百餘萬人開通濟渠，從西苑引穀水、洛水入黃河，又從板渚引黃河水通淮河。其後又開永濟渠（608）、江南河（610），形成以洛陽為中心、北抵涿郡、南達餘杭的運河系統。" />
