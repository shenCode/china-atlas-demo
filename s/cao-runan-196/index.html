    <title>曹操破汝潁黃巾（196年） · 華夏歷史輿圖</title>
    <meta name="description" content="建安元年正月，曹操軍臨武平，袁術所置陳相袁嗣出降。汝南、潁川黃巾何儀、劉辟、黃邵、何曼等各擁眾數萬，先應袁術，後附孫堅；二月曹操進軍討破之，斬劉辟、黃邵等，何儀及其眾皆降。" />
