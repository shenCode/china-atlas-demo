    <title>崇寧取湟、鄯（王厚、童貫）（1103年） · 華夏歷史輿圖</title>
    <meta name="description" content="河湟吐蕃唃廝囉之後內爭。徽宗崇寧二年，蔡京主開邊，命王厚、童貫自熙州出兵，連下諸城，己巳進至湟州，王亨夜奪水門入，登西城而呼「得湟州矣」。三年復取鄯、廓二州，甲申改鄯州為西寧州，仍為隴右節度。青唐故地盡入於宋，「西寧」之名自此始。" />
