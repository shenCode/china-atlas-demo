    <title>甘露之變（835年） · 華夏歷史輿圖</title>
    <meta name="description" content="大和九年十一月，文宗與宰相李訓、鄭注謀誅宦官，詐稱金吾仗院的石榴樹上降了甘露，引宦官前往觀看伏兵誅殺。宦官發現帷幕後的伏兵，急忙擁文宗回宮。神策軍中尉仇士良率兵反撲，宰相王涯、賈餗、舒元輿、李訓等十餘家被滅族，京師大駭。" />
