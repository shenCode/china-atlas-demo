    <meta name="description" content="秦昭襄王二十八年，大良造白起攻楚，取鄢、鄧。《史記》只記拔城。六世紀的《水經注》記白起引西山長谷水，自城西灌城東，水潰城東北角，百姓隨水流，死於城東者數十萬。次年白起拔郢。" />
