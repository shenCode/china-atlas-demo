    <title>吐蕃（629–842年） · 華夏歷史輿圖</title>
    <meta name="description" content="青藏高原上的王朝。贊普弄贊（松贊干布）時強盛；641年唐太宗以文成公主嫁之，弄贊率部兵至柏海，親迎於河源。其後與唐爭奪安西四鎮、河西與隴右，763年一度攻入長安，立廣武王承宏為帝，十五日而退。842年後王室分裂，帝國瓦解。" />
