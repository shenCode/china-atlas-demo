    <title>興教門之變（926年） · 華夏歷史輿圖</title>
    <meta name="description" content="李存勗滅梁後寵信伶人宦官、猜忌功臣，各地兵變四起，大將李嗣源被擁立入汴。同光四年四月初一，從馬直指揮使郭從謙在洛陽作亂，李存勗中流矢而死，屍體被伶人焚燒。李嗣源隨即入洛即位，是為後唐明宗。" />
