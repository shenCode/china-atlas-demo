    <title>北魏取并州、中山、鄴（栢肆之戰）（396年） · 華夏歷史輿圖</title>
    <meta name="description" content="皇始元年八月，道武帝親率六軍四十餘萬，南出馬邑，越句注，旌旗綿延二千餘里。九月兵臨晉陽，後燕并州牧慕容農棄城東逃，并州平。十月出井陘，十一月至真定，常山以東守宰或棄城或歸降，唯中山、鄴、信都不下。" />
