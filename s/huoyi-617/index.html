    <title>霍邑之戰（617年） · 華夏歷史輿圖</title>
    <meta name="description" content="李淵率兵三萬自太原西圖關中，駐營靈石縣賈胡堡；隋武牙郎將宋老生屯霍邑拒之。時霖雨連旬，糧運不繼，李淵命回師，李世民切諫乃止。八月辛巳，李淵引兵趨霍邑，斬宋老生，平定霍邑；隨即攻下臨汾、絳郡，進至龍門。" />
