    <title>劉邦西入關（武關、藍田）（前208年） · 華夏歷史輿圖</title>
    <meta name="description" content="楚懷王遣宋義、項羽北救趙，令沛公西略地入關，並約「先入定關中者王之」。劉邦西與秦將楊熊戰於白馬、曲遇東，大破之；略南陽郡，南陽守齮退保宛城。劉邦原欲越宛西進，用張良之諫，夜間改道回師，黎明圍宛三匝，招降宛守，封為殷侯，此後西進所過皆下。" />
