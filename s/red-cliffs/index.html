    <title>赤壁之戰（208年） · 華夏歷史輿圖</title>
    <meta name="description" content="建安十三年冬，曹操既得荊州，自江陵順江東下；孫權、劉備合兵拒之，遇於赤壁。據吳方記載，曹軍船艦首尾相接，黃蓋詐降縱火，延燒岸上營落；曹軍又遭大疫，引軍北還。魏、蜀、吳三方所記各異（見「史料異說」）。南北分立之勢自此而定。" />
