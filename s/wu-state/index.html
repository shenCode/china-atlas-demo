    <meta name="description" content="春秋後期興起於太湖一帶。前506年吳王闔廬與伍子胥、孫武謀，聯合唐、蔡伐楚，五戰五勝，攻入郢都。前496年闔廬敗於檇李，傷重而死；前494年其子夫差敗越於夫椒，越王句踐退保會稽。其後越乘吳國疲弊，圍吳三年，前473年吳亡。" />
