    <title>唐平蕭銑（江陵）（621年） · 華夏歷史輿圖</title>
    <meta name="description" content="梁帝蕭銑據荊楚。武德四年，詔發巴蜀兵，以趙郡王李孝恭為荊湘道行軍總管，李靖攝行軍長史，統十二總管，自夔州順流東下，另遣三道並進。孝恭勒兵圍江陵，銑內外阻絕，岑文本勸降，銑乃出降，荊楚、嶺南相繼歸唐。" />
