    <title>玉門關（629年） · 華夏歷史輿圖</title>
    <meta name="description" content="唐代的玉門關在瓜州。玄奘西行至瓜州，聞「從此北行五十餘里有瓠𤬜河…上置玉門關，路必由之，即西境之襟喉也」，關外西北又有五烽。《元和郡縣圖志》則記玉門關在瓜州晉昌縣東二十步。" />
