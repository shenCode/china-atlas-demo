    <title>寧平城之戰（311年） · 華夏歷史輿圖</title>
    <meta name="description" content="永嘉五年，執掌朝政的東海王司馬越死於項城，秘不發喪，由襄陽王司馬範統其眾護喪東歸。石勒追及其軍，將軍錢端出戰身死，晉軍崩潰。石勒焚司馬越靈柩，以騎兵包圍數十萬晉軍射殺，屍體相踏如山，太尉王衍等王公以下死者十餘萬人，西晉主力自此盡喪。" />
