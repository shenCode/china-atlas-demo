    <title>釣魚城之戰（1259年） · 華夏歷史輿圖</title>
    <meta name="description" content="蒙哥汗親征四川，圍攻合州釣魚城，宋將王堅固守。六月蒙軍夜登外城馬軍寨，被王堅擊退，天明遇雨，梯折而止。是月蒙哥不豫，七月崩於釣魚山。蒙古諸王為爭汗位紛紛北返，忽必烈與宋議和北還，南宋又延續了二十年。" />
