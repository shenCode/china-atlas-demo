    <title>上源驛之變（朱全忠襲李克用）（884年） · 華夏歷史輿圖</title>
    <meta name="description" content="中和四年五月甲戌，李克用追擊黃巢後至汴州，營於城外，朱全忠固請入城，館於上源驛。席間克用乘酒使氣，語侵全忠；薄暮罷酒，宣武將楊彥洪與全忠謀，連車樹柵塞路，發兵圍驛而攻之。克用得脫歸河東，自此晉、汴結為世仇，相攻數十年。" />
