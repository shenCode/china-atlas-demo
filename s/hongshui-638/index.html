    <title>泓水之戰（前638年） · 華夏歷史輿圖</title>
    <meta name="description" content="宋襄公與楚成王戰於泓水。楚軍渡河時，大臣目夷勸他趁其半渡出擊，襄公不聽；楚軍渡河後尚未列陣，又勸出擊，襄公仍要等對方列好陣勢。結果宋軍大敗，襄公大腿受傷，次年傷重而死。" />
