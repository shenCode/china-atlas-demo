    <title>淮南王允討趙王倫（300年） · 華夏歷史輿圖</title>
    <meta name="description" content="八月，趙王倫轉中護軍淮南王司馬允為太尉，實奪其兵權。允不得入宮，遂率所部圍相府；其兵精銳，倫與戰屢敗，死者千餘人，弓弩齊發，飛矢雨下。伏胤詐稱有詔助允，允開陣納之，下車受詔，為胤所殺，其子秦王郁、漢王迪同死，坐允夷滅者數千人。" />
