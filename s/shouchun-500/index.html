    <title>壽春之戰（裴叔業降魏）（500年） · 華夏歷史輿圖</title>
    <meta name="description" content="景明元年正月，南齊豫州刺史裴叔業以壽春降魏，北魏彭城王元勰率車騎十萬前往接應。南齊胡松、李居士率萬餘人屯宛，陳伯之水軍溯淮而上進逼壽春；四月，元勰與王肅大破齊軍，斬首萬數。七月陳伯之再寇淮南，八月元勰又破之於肥口。" />
