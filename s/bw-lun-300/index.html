    <title>趙王倫廢殺賈后（300年） · 華夏歷史輿圖</title>
    <meta name="description" content="八王之第三王。賈后既害太子遹，四月，右軍將軍趙王司馬倫與孫秀矯詔敕三部司馬入宮，廢賈后為庶人，幽於建始殿；執張華、裴頠、解系、解結等於殿前，皆斬之，夷三族。倫自為相國。己亥，矯詔賜賈后金屑酒，死於金墉城。" />
