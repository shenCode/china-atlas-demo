    <meta name="description" content="蕭詧，梁昭明太子子，為雍州刺史鎮襄陽，與湘東王繹相攻，附西魏。西魏克江陵，立詧為梁主，居江陵東城，有江陵一州之地；稱帝，而為魏、周、隋之藩。傳巋、琮；隋開皇七年廢之。" />
