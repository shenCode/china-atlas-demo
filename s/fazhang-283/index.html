    <title>莒人立法章為齊王（襄王）（前283年） · 華夏歷史輿圖</title>
    <meta name="description" content="淖齒之亂，湣王之子法章改名換姓，在莒太史敫家為傭；太史敫之女覺其狀貌不凡，常暗中給他衣食，與之私通。王孫賈殺淖齒後，齊亡臣求湣王子欲立之，法章恐被誅，久而後敢自言。莒人共立法章為齊王，保莒城以拒燕，是為襄王；以太史氏女為王后，即君王后。" />
