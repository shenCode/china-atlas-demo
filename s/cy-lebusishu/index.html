    <title>樂不思蜀（264年） · 華夏歷史輿圖</title>
    <meta name="description" content="意為樂而忘返，或樂而忘本。蜀亡，後主劉禪遷至洛陽。司馬昭設宴，作故蜀之伎，旁人皆為之感愴，劉禪喜笑自若。他日司馬昭問：「頗思蜀否？」劉禪說：「此間樂，不思蜀。」" />
