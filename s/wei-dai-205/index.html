    <title>韓信破魏、代（夏陽木罌渡河）（前205年） · 華夏歷史輿圖</title>
    <meta name="description" content="漢二年，魏王豹以探親為名歸國，隨即截斷黃河渡口，反漢歸楚。八月漢以韓信為左丞相擊魏。魏王重兵屯蒲阪、堵塞臨晉，韓信大張疑兵，陳列船隻作勢從臨晉渡河，暗中以伏兵從夏陽乘木罌缻渡河，襲取安邑。魏王豹大驚，引兵迎戰，被韓信所俘，魏地成為河東郡。" />
