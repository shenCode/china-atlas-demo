    <title>西洱河之戰（鮮于仲通敗於南詔）（751年） · 華夏歷史輿圖</title>
    <meta name="description" content="天寶十載四月壬午，劍南節度使鮮于仲通討南詔，大敗於瀘南。進軍至西洱河，與閣羅鳳戰，軍大敗，士卒死者六萬人，仲通僅以身免。南詔自此附於吐蕃。" />
