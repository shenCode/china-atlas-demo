    <title>靖康之變（1126年） · 華夏歷史輿圖</title>
    <meta name="description" content="靖康元年閏十一月金軍攻破開封。次年三月金人立張邦昌為楚帝，搜取宋宗室；丁巳脅迫太上皇（徽宗）北行，四月庚申把欽宗及皇后、皇太子押往北方，連同法駕鹵簿、禮器、八寶、九鼎、渾天儀、秘閣藏書與天下州府圖等一併擄去。北宋亡。" />
