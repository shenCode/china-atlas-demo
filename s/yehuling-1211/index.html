    <title>野狐嶺、會河川之戰（1211年） · 華夏歷史輿圖</title>
    <meta name="description" content="成吉思汗親自南伐，於野狐嶺擊敗金將定薛，取大水濼、豐利等縣。金重築烏沙堡，七月遮別攻拔之；八月成吉思汗與金軍戰於宣平之會河川，大敗之；九月拔德興府，居庸關守將遁走，遮別入關直抵中都。《金史》記九月金將千家奴、胡沙敗績於會河堡，居庸關失守。" />
