    <title>廢橋之戰（苻登敗亡）（394年） · 華夏歷史輿圖</title>
    <meta name="description" content="姚萇死，苻登以為姚興年少可欺，盡眾東進，攻克姚奴、帛蒲二堡，自甘泉向關中。姚興緊追其後，苻登自六陌趨廢橋，姚興部將尹緯據橋以待；苻登爭水不得，士卒渴死者十之二三，與尹緯大戰失利，當夜兵潰，單馬奔雍。" />
