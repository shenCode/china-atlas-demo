    <meta name="description" content="意為誠心誠意、再三邀請賢才。劉備屯新野，徐庶薦諸葛亮，說「此人可就見，不可屈致也」。劉備於是親往隆中，「凡三往，乃見」，諸葛亮為他陳說三分天下之計。諸葛亮後來在《出師表》中自述：先帝不以臣卑鄙，「三顧臣於草廬之中」。" />
