    <title>舒之圍（李憲之亡）（28年） · 華夏歷史輿圖</title>
    <meta name="description" content="李憲於王莽時任廬江連率，莽敗後據郡自守，更始元年自稱淮南王，建武三年自立為天子，擁九城，眾十餘萬。四年秋，光武幸壽春，遣揚武將軍馬成率三將軍伐憲，九月圍之於舒，至六年正月拔之。本紀記「獲李憲」；〈李憲傳〉記憲亡走，其軍士帛意追斬憲而降。" />
