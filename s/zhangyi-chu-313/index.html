    <title>張儀欺楚：商於之地六百里（前313年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦王欲伐齊，擔心齊、楚合縱相親，使張儀至楚說懷王：大王若能閉關與齊絕約，「臣請獻商於之地六百里」。懷王大悅，與齊絕交，還派勇士北上辱罵齊王。使者隨張儀入秦受地，張儀佯墮車，不朝三月；及見，說：「臣有奉邑六里，願以獻大王左右。" />
