    <title>鄴之戰（北齊之亡）（577年） · 華夏歷史輿圖</title>
    <meta name="description" content="建德六年正月，周武帝至鄴，北齊後主先於城外掘塹立柵；周軍圍城，齊人拒守，周軍奮擊大破之，遂平鄴。北齊後主先將母親與妻子送往青州，城陷後率數十騎逃往青州，周將尉遲勤率二千騎追擊，於青州擒獲北齊後主及太子高恆。" />
