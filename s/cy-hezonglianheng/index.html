    <title>合縱連橫（前333年） · 華夏歷史輿圖</title>
    <meta name="description" content="意為聯合或分化各方的外交策略：合縱是六國南北相連以抗秦，連橫是各國東西向分別事秦。《史記》記蘇秦說六國合縱，「為從約長，并相六國」；張儀則為秦連橫，說各國事秦。《漢書·刑法志》總括戰國之世：「合從連衡，轉相攻伐，代為雌雄。」" />
