    <title>晉陽之戰（高延宗）（576年） · 華夏歷史輿圖</title>
    <meta name="description" content="北齊後主逃往鄴城，留安德王高延宗守并州，高延宗即位，改元德昌。周軍至并州，高延宗率四萬人出城抵抗，周武帝擊退之，乘勝率千餘騎入東門。當夜高延宗率眾排陣反攻，周軍大敗，死傷殆盡，城門因屍體堆積不能關閉，周武帝隨數騎冒險得以出城。" />
