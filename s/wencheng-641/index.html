    <title>文成公主入藏（641年） · 華夏歷史輿圖</title>
    <meta name="description" content="貞觀十五年，唐太宗以文成公主嫁吐蕃贊普弄贊（松贊干布），命江夏郡王李道宗主婚並持節護送。弄贊率部兵駐柏海，親迎於河源，見道宗時執子婿之禮甚恭，並讚嘆唐朝服飾禮儀之美。" />
