    <title>街亭之戰（禿髮烏孤破竇苟）（397年） · 華夏歷史輿圖</title>
    <meta name="description" content="隆安元年，河西鮮卑禿髮烏孤自稱大單于、西平王，年號太初，耀兵廣武，攻克金城。呂光遣將軍竇苟來伐，戰於街亭，烏孤大敗之；後涼的樂都、湟河、澆河三郡降於烏孤，嶺南羌胡數萬落皆來歸附。" />
