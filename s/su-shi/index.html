    <title>蘇軾（1037–1101年） · 華夏歷史輿圖</title>
    <meta name="description" content="眉州眉山人。1079年御史摭其表語與詩作指為訕謗，逮赴御史臺獄（烏臺詩案）；神宗憐之，以黃州團練副使安置。在黃州「築室於東坡，自號東坡居士」。後屢遭貶謫，遠至惠州、儋州，1101年北歸途中卒於常州。" />
