    <title>誅梁冀（159年） · 華夏歷史輿圖</title>
    <meta name="description" content="外戚梁冀專權二十年，毒死質帝，立桓帝，權傾朝野。延熹二年，桓帝與宦官單超等五人密謀，派司隸校尉張彪率兵包圍梁冀府第，收其大將軍印綬，梁冀與妻自殺。五名宦官同日封侯，宦官從此專權。" />
