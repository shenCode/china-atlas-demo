    <title>青海之戰（李敬玄敗於論欽陵）（678年） · 華夏歷史輿圖</title>
    <meta name="description" content="儀鳳三年九月丙寅，中書令李敬玄將兵十八萬與吐蕃將論欽陵戰於青海之上，兵敗，工部尚書劉審禮為吐蕃所虜。敬玄聞審禮戰沒，狼狽還走，頓於承風嶺，阻泥溝以自固，吐蕃屯兵高岡以壓之。" />
