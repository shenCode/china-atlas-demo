    <title>大非川之戰（670年） · 華夏歷史輿圖</title>
    <meta name="description" content="咸亨元年，唐將薛仁貴、郭待封進至大非川，被吐蕃大將論欽陵襲擊，大敗，薛仁貴等被免職。吐谷渾全境淪沒，只有慕容諾曷缽率親信數千帳內附，被遷到靈州一帶。唐在青海一帶的優勢自此喪失。" />
