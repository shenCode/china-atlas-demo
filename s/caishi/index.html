    <title>采石之戰（1161年） · 華夏歷史輿圖</title>
    <meta name="description" content="紹興三十一年金主完顏亮大舉南侵，兩淮盡失。十一月金主率大軍至采石，另以兵爭瓜洲。中書舍人虞允文奉命到采石犒師，主將王權已去、新帥李顯忠未到，金騎遍佈江北；虞允文收集散兵，督軍迎戰，擊退渡江的金軍。不久完顏亮在瓜洲被部下所殺，金軍北撤。" />
