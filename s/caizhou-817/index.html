    <title>李愬雪夜入蔡州（817年） · 華夏歷史輿圖</title>
    <meta name="description" content="元和十二年冬，唐鄧節度使李愬在風雪之夜率軍急行，至張柴才宣布「入蔡州取吳元濟也」。半夜雪下得更大，他令人驚擾城邊的鵝鴨池以掩蓋行軍聲；李祐、李忠義鑿牆先登，殺盡守門士卒。黎明雪止，李愬入城，吳元濟還以為是自家士兵回城取寒衣。" />
