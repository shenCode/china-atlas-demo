    <title>張須陀之死（滎陽）（616年） · 華夏歷史輿圖</title>
    <meta name="description" content="隋滎陽通守張須陀屢敗翟讓。李密勸翟讓進取洛口倉，二人率兵逼滎陽，張須陀出拒；翟讓不利退卻，張須陀乘勝追擊，李密預先埋伏於林間的伏兵自後掩擊，須陀軍潰。李密與翟讓合兵圍之，須陀潰圍而出，又數度躍馬入救部眾，終下馬戰死。伏兵之數，兩傳所記不同。" />
