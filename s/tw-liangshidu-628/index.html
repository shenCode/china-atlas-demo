    <title>唐平梁師都（朔方）（628年） · 華夏歷史輿圖</title>
    <meta name="description" content="隋末群雄至此惟餘朔方梁師都，倚突厥為援。貞觀二年，太宗遣柴紹、薛萬均擊之。突厥大發兵來救，柴紹等未至朔方數十里與突厥遇，奮擊大破之，遂圍朔方。壬寅，師都從父弟洛仁殺師都，以城降，以其地為夏州。隋末群雄至此盡平。" />
