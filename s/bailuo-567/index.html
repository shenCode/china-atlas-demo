    <title>白螺之戰（華皎之亂）（567年） · 華夏歷史輿圖</title>
    <meta name="description" content="光大元年，陳將華皎密求廣州以探朝廷之意，又暗中勾引北周、奉後梁蕭巋為主。蕭巋遣水軍聲援，北周遣宇文直屯魯山，拓跋定率人馬三萬攻圍郢州。華皎陳於巴州白螺，與陳軍相持；聞徐度趨湘州襲其後，乃乘順風下戰。" />
