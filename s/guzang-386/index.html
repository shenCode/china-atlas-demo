    <title>姑臧城南之戰（張大豫之敗）（385年） · 華夏歷史輿圖</title>
    <meta name="description" content="苻堅兵敗後，前涼張天錫南奔，其世子張大豫為王穆所匿。張大豫起兵進逼姑臧，進屯城西，王穆率眾三萬與思復犍之子奚于陣於城南；呂光出擊破之，斬奚于等二萬餘級。其後廣武人擒張大豫，送至姑臧斬於市。" />
