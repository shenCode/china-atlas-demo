    <title>李悝變法（前424年） · 華夏歷史輿圖</title>
    <meta name="description" content="魏文侯在位時，李悝為他「作盡地力之教」，又行平糴之法，魏國因此富強；其年不詳。盡地力，是估算百里之地的田畝與收成，使農夫勤於耕作；平糴，是豐年由官府收糧、荒年放出，使糧價不傷農也不傷民。" />
