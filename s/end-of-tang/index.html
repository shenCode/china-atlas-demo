    <meta name="description" content="天祐四年四月，宣武軍節度使朱溫（朱全忠）受唐哀帝禪讓。甲子日，宰相張文蔚、楊涉等奉冊寶至汴州金祥殿，朱溫「被袞冕，即皇帝位」，國號梁，唐亡，五代十國開始。" />
