    <title>晉陽之戰（周、突厥攻晉陽）（563年） · 華夏歷史輿圖</title>
    <meta name="description" content="北周柱國楊忠率騎一萬會同突厥阿史那木汗等二十餘萬人，自恒州分三道南下，殺掠吏民，大將軍達奚武又率數萬人至東雍及晉州相應。時大雪連月，平地積雪數尺。北齊武成帝自鄴倍道趕赴晉陽，突厥自北結陣而來，東至汾河，西達風谷；周軍以步卒為前鋒自西山而下。" />
