    <title>侯景之亂（548年） · 華夏歷史輿圖</title>
    <meta name="description" content="太清二年八月，降梁的侯景自壽陽起兵，十月渡江圍建康臺城。圍城中引玄武湖水灌城，城中軍民死亡殆盡；次年三月臺城陷，梁武帝憂憤而死。侯景殘破江南，551年自立為帝，552年為王僧辯、陳霸先所敗被殺。" />
