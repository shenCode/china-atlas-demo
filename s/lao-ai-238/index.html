    <title>嫪毐之亂（前238年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦王政九年四月，王在雍行冠禮之時，長信侯嫪毐矯王與太后之璽發兵作亂，戰於咸陽，敗走被擒，車裂，滅其宗。毐所發為縣卒、衛卒、官騎、戎翟君公、舍人，將攻蘄年宮；王令相國昌平君、昌文君發卒攻之，斬首數百。衛尉竭等二十人梟首，舍人奪爵遷蜀四千餘家。" />
