    <title>落門之戰（隴右平）（33年） · 華夏歷史輿圖</title>
    <meta name="description" content="九年正月，隗囂病死，其將王元、周宗立其子純為王；〈隗囂傳〉記囂病且餓，出城食糗糒，恚憤而死。八月，光武遣中郎將來歙監征西大將軍馮異等五將軍討隗純於天水。十年冬十月，來歙等大破隗純於落門，其將王元奔蜀，純與周宗降，隴右平。" />
