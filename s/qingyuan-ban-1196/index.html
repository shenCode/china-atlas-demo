    <meta name="description" content="韓侂冑排擠宰相趙汝愚後掌權，指朱熹等人的道學為「偽學」。慶元年間朝廷禁止偽學，列出「偽學逆黨籍」五十九人，凡與之有關者不得任官、應試，史稱慶元黨禁。1202年才解除。" />
