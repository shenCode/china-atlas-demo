    <title>天山之戰（竇固破呼衍王）（73年） · 華夏歷史輿圖</title>
    <meta name="description" content="永平十六年春二月，漢分四道伐北匈奴：祭肜出高闕，竇固出酒泉，耿秉出居延，來苗出平城。竇固與耿忠至天山擊呼衍王，斬首千餘級，追至蒲類海，留吏士屯伊吾盧城；其餘三路皆無功而還。其後漢罷伊吾盧屯兵。" />
