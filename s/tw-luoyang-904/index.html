    <title>朱全忠遷昭宗於洛陽（904年） · 華夏歷史輿圖</title>
    <meta name="description" content="朱全忠屢表請遷都洛陽。天復四年（是年改元天祐）正月壬戌，車駕發長安，全忠以張廷范為御營使，毀長安宮室、百司及民間廬舍，取其材浮渭河而下，長安自此遂為丘墟。八月，昭宗在洛陽遇弒；三年後朱全忠受禪，唐亡。" />
