    <title>田忌賽馬（前357年） · 華夏歷史輿圖</title>
    <meta name="description" content="孫臏到齊後，齊將田忌以客禮待之。田忌常與齊國諸公子賽馬，下重注。孫臏見各家的馬腳力相差不遠，都分上、中、下三等，就對田忌說：「君弟重射，臣能令君勝。」臨賽時他說：「今以君之下駟與彼上駟，取君上駟與彼中駟，取君中駟與彼下駟。" />
