    <title>孫策渡江（平定江東）（195年） · 華夏歷史輿圖</title>
    <meta name="description" content="揚州刺史劉繇因壽春為袁術所據，渡江治曲阿，遣樊能、于麋屯橫江津，張英屯當利口以拒袁術。孫策說袁術，請助吳景等平定江東，袁術表其為折衝校尉，兵僅千餘、騎數十；至歷陽時眾已五六千。孫策渡江轉戰，所向皆破，劉繇棄軍遁逃，諸郡守皆棄城奔走。" />
