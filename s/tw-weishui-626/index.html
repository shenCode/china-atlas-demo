    <title>渭水之盟（頡利至便橋）（626年） · 華夏歷史輿圖</title>
    <meta name="description" content="太宗即位之初，八月癸未，東突厥頡利可汗進至渭水便橋之北，遣執失思力入見以觀虛實。太宗自出玄武門，與高士廉、房玄齡等逕詣渭水上，與頡利隔水而語，責以負約。乙酉，斬白馬，與頡利盟於便橋之上，突厥引兵退。" />
