    <meta name="description" content="更始二年冬，赤眉崇、安自武關，宣等從陸渾關，兩道入關；三年正月俱至弘農，與更始諸將連戰皆勝，眾遂大集，分為三十營，進至華陰。赤眉立劉盆子為天子。軍至高陵，與更始叛將張卬等連和，攻東都門入長安；〈光武紀〉記赤眉入長安，更始奔高陵。" />
