    <title>襄陵之役（前353年） · 華夏歷史輿圖</title>
    <meta name="description" content="魏軍困於邯鄲之時，宋景善攴、衛公孫倉會合齊師，圍魏的襄陵。次年魏惠王以韓師擊敗諸侯之師於襄陵，齊侯使楚將景舍來求和，惠王與齊、宋之圍者相會。《戰國策》記齊臣段干綸之謀：不直救邯鄲，「南攻襄陵以弊魏」。" />
