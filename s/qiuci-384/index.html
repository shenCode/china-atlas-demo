    <title>呂光西征龜茲（383年） · 華夏歷史輿圖</title>
    <meta name="description" content="苻堅平定山東後有圖西域之志，命呂光率姜飛、彭晃、杜進等總兵七萬、鐵騎五千西討西域。行至高昌，聞苻堅南伐東晉。進兵至焉耆，焉耆王泥流率旁國請降；龜茲王帛純拒守，呂光軍於城南，五里一營，深溝高壘，以木人披甲列於壘上為疑兵。" />
