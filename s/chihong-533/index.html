    <title>赤洪嶺之戰（尒朱兆之死）（532年） · 華夏歷史輿圖</title>
    <meta name="description" content="永熙元年七月高歡率師北伐尒朱兆，自滏口入，尒朱兆大掠晉陽後北保秀容，并州遂平。尒朱兆在秀容分兵守險，出入寇抄；高歡數次揚言出兵而止，使其懈怠，估計其歲首必定宴會，遣竇泰率精騎一日一夜疾馳三百里，自率大軍繼之。" />
