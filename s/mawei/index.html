    <title>馬嵬驛之變（756年） · 華夏歷史輿圖</title>
    <meta name="description" content="潼關失守後，玄宗於六月乙未凌晨出延秋門西逃。丙辰至馬嵬驛，護駕禁軍停步不前，龍武大將軍陳玄禮奏請誅殺楊國忠以平眾怒。楊國忠被殺，楊貴妃亦被賜死。玄宗繼續入蜀，太子則北上靈武即位。" />
