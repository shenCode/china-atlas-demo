    <title>平川之戰（乞伏乾歸斬楊定）（394年） · 華夏歷史輿圖</title>
    <meta name="description" content="苻登為姚興所殺後，氐王楊定率步騎四萬來伐乞伏乾歸。乾歸遣軻殫、益州、詰歸拒之，楊定先敗益州於平川，軻殫、詰歸引兵後退；其後軻殫率騎赴救，益州、詰歸亦整兵再進，大敗楊定，斬楊定及首虜一萬七千級，西秦於是盡有隴西之地。" />
