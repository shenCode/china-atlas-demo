    <title>吳師入郢（前506年） · 華夏歷史輿圖</title>
    <meta name="description" content="吳王闔廬問伍子胥、孫武伐楚之策，二人建議聯合怨恨楚將子常的唐、蔡。吳軍與唐、蔡西伐楚，至漢水；闔廬之弟夫槩以所部五千人先擊楚軍，楚兵大敗。吳軍追擊，「比至郢，五戰，楚五敗」，楚昭王出奔，吳兵入郢，伍子胥、伯嚭鞭楚平王之屍以報父仇。" />
