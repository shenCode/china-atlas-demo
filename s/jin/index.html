    <title>晉（266–316年） · 華夏歷史輿圖</title>
    <meta name="description" content="司馬炎受魏禪建晉，都洛陽。太康元年滅吳，三國歸一。惠帝時八王之亂，永嘉五年（311）洛陽陷落，建興四年（316）長安陷落，愍帝出降，西晉亡；次年司馬睿於建康稱晉王，是為東晉。" />
