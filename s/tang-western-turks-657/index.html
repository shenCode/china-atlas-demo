    <title>蘇定方討賀魯（651年） · 華夏歷史輿圖</title>
    <meta name="description" content="永徽元年末，瑤池都督阿史那賀魯叛唐，自稱可汗，盡有西域之地。唐軍數度征討不利；顯慶二年（657）正月，高宗命蘇定方等四將軍為伊麗道將軍出兵討伐，同年擊破賀魯，西突厥汗國滅亡，唐在其地分置都護府。" />
