    <title>陳橋兵變（960年） · 華夏歷史輿圖</title>
    <meta name="description" content="後周顯德七年正月，殿前都點檢趙匡胤率軍北禦契丹，夜宿陳橋驛。五更時軍士聚集驛門，宣稱要擁立點檢為天子；天明逼入寢所，諸將露刃列於庭中說：「諸軍無主，願策太尉為天子。」趙匡胤還沒回答，「有以黃衣加太祖身」，眾人羅拜高呼萬歲。" />
