    <title>劍閣（263年） · 華夏歷史輿圖</title>
    <meta name="description" content="景元四年（263）魏伐蜀，姜維、廖化與張翼、董厥退保劍閣以拒鍾會，列營守險，會不能克，糧運懸遠，將議還歸；而鄧艾自陰平由景谷道傍入，破諸葛瞻於綿竹，後主請降。唐劍州有大劍鎮，本姜維拒鍾會之壘，峭壁千丈，下瞰絕澗，飛閣以通行旅。" />
