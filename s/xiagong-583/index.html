    <title>下宮之難（趙氏孤兒）（前583年） · 華夏歷史輿圖</title>
    <meta name="description" content="晉趙莊姬因趙嬰被逐，向晉景公譖告趙同、趙括「將為亂」，欒氏、郤氏為之作證。六月，晉討趙同、趙括；趙武隨莊姬養於公宮，趙氏之田給了祁奚。韓厥對景公說，成季（趙衰）之勳、宣孟（趙盾）之忠而無後，為善者將懼；乃立趙武，歸其田。" />
