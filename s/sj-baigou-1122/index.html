    <title>宋攻燕京之敗（白溝）（1122年） · 華夏歷史輿圖</title>
    <meta name="description" content="宣和四年，金已取遼中京、西京，遼天祚帝西走，耶律淳自立於燕。宋以童貫為宣撫使，發兵十餘萬趨燕，分兩道：种師道總東路趨白溝，辛興宗總西路趨范村。耶律淳遣耶律大石、蕭幹禦之；師道次白溝，前軍楊可世敗績，宋軍退保雄州。" />
