    <title>秦、齊稱帝（前288年） · 華夏歷史輿圖</title>
    <meta name="description" content="冬十月，秦昭王稱西帝，遣魏冉致帝號於齊，立齊湣王為東帝，想相約共伐趙。蘇代自燕來，勸齊王受之而勿稱，看天下的反應；若天下惡之，則去帝號以收人心。齊王稱帝二月而復為王；十二月，秦也去帝號，復稱王。" />
