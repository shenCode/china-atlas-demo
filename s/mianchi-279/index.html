    <title>澠池之會（前279年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦王遣使告趙王，願在西河外的澠池為好會。趙王畏秦，不想去；廉頗、藺相如說：「王不行，示趙弱且怯也。」趙王遂行，相如從。廉頗送至邊境，與王約：往返不過三十日，三十日不還，請立太子為王，以絕秦望。" />
