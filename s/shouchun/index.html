    <meta name="description" content="甘露二年五月，魏征東大將軍諸葛誕被徵為司空，疑懼而反，據壽春，引吳為援。司馬昭督中外諸軍二十六萬圍之；次年城破，誕突圍被斬，夷三族。淮南三次叛亂至此而終。" />
