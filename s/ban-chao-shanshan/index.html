    <title>班超使西域（73年） · 華夏歷史輿圖</title>
    <meta name="description" content="班超出使西域，在鄯善遇到匈奴使者，鄯善王態度轉冷。班超對部下說：「不入虎穴，不得虎子。」夜裡以火攻殺匈奴使者，鄯善震恐降服。此後班超經營西域近三十年，官至西域都護。" />
