    <title>雍熙北伐與楊業之死（986年） · 華夏歷史輿圖</title>
    <meta name="description" content="雍熙三年，宋太宗分三路伐遼，東路曹彬在岐溝關大敗，全線撤退。西路副帥楊業奉命掩護雲、應等州百姓內遷，主帥潘美、監軍王侁逼他出戰，楊業請他們在陳家谷口設伏接應，出戰後轉戰至谷口卻不見援兵，力戰被俘，絕食三日而死。" />
