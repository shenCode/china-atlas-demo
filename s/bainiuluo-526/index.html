    <title>白牛邏之戰（葛榮稱帝）（526年） · 華夏歷史輿圖</title>
    <meta name="description" content="孝昌二年八月，賊帥元洪業斬鮮于脩禮請降，為葛榮所殺。九月，葛榮於博野白牛邏大敗北魏廣陽王元淵、章武王元融，元融戰死；葛榮自稱天子，國號齊，年號廣安。" />
