    <title>臨河之戰（謝艾踞胡床）（347年） · 華夏歷史輿圖</title>
    <meta name="description" content="張重華以謝艾為使持節、軍師將軍，率步騎三萬進軍臨河，麻秋以三萬眾迎戰。謝艾乘軺車而來，麻秋見其冠服，怒其輕己，遣黑槊龍驤三千騎衝擊，謝艾左右大亂；部將勸其上馬，謝艾不從，下車踞胡床指揮，趙軍以為有伏兵，不敢前進。" />
