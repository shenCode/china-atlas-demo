    <meta name="description" content="秦將，年少壯勇，曾以數千兵追燕太子丹至衍水。對始皇言伐楚不過用二十萬人，遂與蒙恬將二十萬南伐；初勝，後荊人隨之三日三夜不頓舍，大破李信軍，殺七都尉。始皇乃復用王翦。" />
