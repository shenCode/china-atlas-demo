    <title>雀鼠谷之戰（唐平劉武周）（619年） · 華夏歷史輿圖</title>
    <meta name="description" content="武德二年，馬邑劉武周與宋金剛南侵，圍并州，齊王元吉夜棄州奔還長安，河東幾盡失。秦王李世民與宋金剛相持，至三年四月金剛軍中食盡北走，世民追之，及於雀鼠谷，一日八戰皆破之，俘斬數萬人。劉武周聞金剛敗，棄并州走突厥，河東復為唐有。" />
