    <meta name="description" content="靖康之變後，高宗即位於南京應天府，旋退揚州，1129年渡江。《宋史》說：「高宗南渡，民之從者如歸市。」是年始詔士民從便避敵，官吏士民家屬南去者，官司不得禁止。史文不記南渡人數。" />
