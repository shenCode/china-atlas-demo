    <title>哥舒翰拔石堡城（749年） · 華夏歷史輿圖</title>
    <meta name="description" content="天寶八載，玄宗命隴右節度使哥舒翰率隴右、河西及突厥阿布思兵，益以朔方、河東兵，凡六萬三千，攻吐蕃石堡城。翰進攻數日不拔，欲斬裨將，二將請三日為期，如期拔之，獲吐蕃四百人，唐士卒死者數萬，果如王忠嗣之言。閏月，以石堡城為神武軍。" />
