    <title>郭子儀單騎見回紇（涇陽）（765年） · 華夏歷史輿圖</title>
    <meta name="description" content="永泰元年，僕固懷恩引回紇、吐蕃入寇，懷恩道死。十月丙寅，回紇、吐蕃合兵圍涇陽，郭子儀命諸將嚴守而不戰。子儀免冑釋甲、投槍而進，回紇諸酋長相顧曰「是也」，皆下馬羅拜，遂與唐約和，吐蕃夜遁。" />
