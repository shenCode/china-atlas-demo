    <meta name="description" content="晉人，曾事范氏、中行氏而無所知名，去而事知伯，知伯甚尊寵之。知伯滅後，他說「士為知己者死」，變名姓為刑人，入宮塗廁欲刺趙襄子，被執而獲釋；又漆身為厲，吞炭為啞，伏於橋下，再被擒。請得襄子之衣，拔劍三躍而擊之，遂伏劍自殺。" />
