    <title>汝南王亮、楚王瑋之死（291年） · 華夏歷史輿圖</title>
    <meta name="description" content="八王之首二王。六月，賈后患太宰司馬亮、太保衛瓘執政，使惠帝作手詔賜楚王司馬瑋，令免二人之官。瑋矯詔召三十六軍，遣公孫宏、李肇圍亮府，亮為肇所執，與世子矩俱死；衛瓘及子孫九人亦被殺。" />
