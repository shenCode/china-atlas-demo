    <title>白馬驛之禍（905年） · 華夏歷史輿圖</title>
    <meta name="description" content="朱全忠既遷昭宗於洛陽而弒之，立哀帝，將篡唐，先除朝士。天祐二年六月，聚裴樞等及朝士貶官者三十餘人於滑州白馬驛，一夕盡殺之，投屍於河。其謀出於李振：振屢舉進士不第，深疾搢紳，謂全忠曰：「此輩常自謂清流，宜投之黃河，使為濁流！" />
