    <title>劉裕北伐（416年） · 華夏歷史輿圖</title>
    <meta name="description" content="義熙十二年，劉裕乘後秦姚興新死、諸子相爭，率軍北伐。次年檀道濟等進抵潼關，王鎮惡率水軍自黃河入渭水，八月攻克長安，生擒姚泓，後秦亡。劉裕旋即東歸，長安翌年為夏所奪。" />
