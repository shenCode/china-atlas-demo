    <meta name="description" content="北周大將。為行軍元帥伐陳，攻拔壽陽，與宇文亮、梁士彥等盡取江北。尉遲迥起兵，韋孝寬為行軍元帥討之，於沁水乘尉遲惇稍卻鳴鼓齊進，大破之，進至鄴；鄴城南之戰一度失利，高熲衝擊觀者，乘亂大破尉遲迥，迥退守北城後自殺。" />
