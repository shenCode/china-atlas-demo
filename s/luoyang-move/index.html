    <meta name="description" content="太和十七年，北魏孝文帝以南伐為名率軍自平城南下，九月至洛陽，群臣於馬前請停南伐，遂定遷都之計。十月幸金墉城、命李沖等營建洛京，告遷都於滑臺；次年十一月正式至洛陽，十二月改革衣服之制。" />
