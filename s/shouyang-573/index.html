    <title>壽陽之戰（吳明徹擒王琳）（573年） · 華夏歷史輿圖</title>
    <meta name="description" content="太建北伐，陳將吳明徹至秦郡，攻克水柵，擊走北齊援將尉破胡，秦郡投降。進逼壽陽，北齊遣王琳與刺史王貴顯據守外郭；吳明徹乘夜進攻，半夜外郭崩潰，齊兵退守相國城及金城。吳明徹堰肥水灌城，城中潮濕，多患腹疾，手足皆腫，死者十之六七。" />
