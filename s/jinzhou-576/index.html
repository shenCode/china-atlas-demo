    <title>晉州、平陽之戰（周武帝破北齊後主）（576年） · 華夏歷史輿圖</title>
    <meta name="description" content="周武帝以晉州為高歡起家之地，攻之北齊必來救援，可以逸待勞。建德五年十月東伐，每日自汾曲親至城下督戰；壬申，北齊晉州刺史崔景嵩夜遣使請降，王軌率眾登城，遂克晉州，擒城主尉相貴，俘甲士八千。" />
