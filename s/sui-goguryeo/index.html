    <title>隋征高句麗（612年） · 華夏歷史輿圖</title>
    <meta name="description" content="大業八年，隋煬帝親征高句麗，大軍「總一百一十三萬三千八百，號二百萬，其餽運者倍之」，首尾四十日才發盡，旌旗亙千里。遠征以慘敗告終：宇文述等九軍渡遼者三十萬五千人，還至遼東城時僅存二千七百人。此後兩年再征，民怨沸騰，隋末大亂由此而起。" />
