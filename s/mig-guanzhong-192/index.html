    <meta name="description" content="李傕、郭汜亂長安，城空四十餘日，二三年間關中無復人跡。關中之民流入荊州者十萬餘家；此前南陽、三輔之民流入益州者數萬家，劉焉收以為兵，號東州兵。兩事史文皆為追述，不繫年。" />
