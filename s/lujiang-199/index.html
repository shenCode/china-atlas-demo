    <title>孫策襲廬江（皖城）（199年） · 華夏歷史輿圖</title>
    <meta name="description" content="袁術死後，其長史楊弘、大將張勳率部眾欲投孫策，廬江太守劉勳中途截擊，盡數俘獲，並收其珍寶。孫策假意與劉勳結盟，勸其出兵攻取豫章上繚宗民萬餘家；劉勳出兵後，孫策輕軍晝夜兼程襲取廬江，劉勳部眾盡降，劉勳僅率數百人投奔曹操。" />
