    <title>龐勛起事（868年） · 華夏歷史輿圖</title>
    <meta name="description" content="咸通九年，徐州派往桂林戍邊的士卒五百人殺死將領，推糧料判官龐勛為首，擅自北還，九月攻陷宿州、徐州，殺節度使崔彥曾，開官庫募兵，十日內聚眾五萬。次年被唐軍與沙陀兵平定。" />
