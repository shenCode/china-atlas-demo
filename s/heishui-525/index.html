    <title>黑水之戰（蕭寶夤破莫折天生）（524年） · 華夏歷史輿圖</title>
    <meta name="description" content="莫折念生遣其兄高陽王天生下隴東寇掠，正光五年八月北魏元志大敗於隴東，退守岐州。九月北魏以齊王蕭寶夤為西道行臺大都督，與崔延伯等西討；孝昌元年正月，蕭寶夤、崔延伯大破秦賊於黑水，斬獲數萬，天生退入隴西，涇、岐及隴東悉平。" />
