    <title>邯鄲之戰（光武滅王郎）（24年） · 華夏歷史輿圖</title>
    <meta name="description" content="林詐稱卜者王郎為成帝子子輿，於十二月立為天子，都邯鄲，趙國以北、遼東以西皆望風歸附。次年光武在薊得郎檄文，南走信都，發兵攻柏人不下；上谷太守耿況、漁陽太守彭寵遣吳漢、寇恂等率突騎來助，更始亦遣謝躬討郎。" />
