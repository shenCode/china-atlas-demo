    <title>阿骨打建金（1115年） · 華夏歷史輿圖</title>
    <meta name="description" content="收國元年正月初一，女真完顏部首領阿骨打即皇帝位。他說遼以賓鐵為號取其堅固，但賓鐵終會變壞，「惟金不變不壞」，金色白而完顏部尚白，於是國號大金，改元收國。數日後親率大軍進攻遼的黃龍府。" />
