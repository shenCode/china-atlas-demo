    <title>令支、密雲之戰（石虎滅段遼）（338年） · 華夏歷史輿圖</title>
    <meta name="description" content="後趙石虎欲伐遼西鮮卑段遼，募勇士三萬人為龍騰中郎。段遼遣從弟屈雲襲幽州，刺史李孟退奔易京。石虎以桃豹、王華統舟師十萬出漂渝津，支雄、姚弋仲統步騎十萬為前鋒；支雄長驅入薊，段遼所屬漁陽、代、北平、上谷等四十餘城皆降。" />
