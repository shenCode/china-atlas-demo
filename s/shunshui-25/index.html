    <title>順水之戰（光武北擊尤來）（25年） · 華夏歷史輿圖</title>
    <meta name="description" content="光武北擊尤來、大搶、五幡於元氏，追至右北平，連破之；又戰於順水北，乘勝輕進，反為所敗。光武自投高岸，得突騎王豐讓馬，耿弇頻射退敵，始得脫身；士卒死者數千人，散兵歸保范陽。" />
