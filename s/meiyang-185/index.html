    <title>美陽之戰（184年） · 華夏歷史輿圖</title>
    <meta name="description" content="北宮伯玉等劫致金城人邊章、韓遂主持軍政，殺金城太守陳懿，次年春率數萬騎寇三輔。張溫、董卓等合諸郡兵十餘萬屯美陽，戰輒不利。十一月，夜有流星照邊、韓營中，賊以為不祥欲歸金城，董卓次日與鮑鴻等合攻，大破之，斬首數千級，邊章、韓遂退走榆中。" />
