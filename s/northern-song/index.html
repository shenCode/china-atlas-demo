    <title>北宋（960–1127年） · 華夏歷史輿圖</title>
    <meta name="description" content="960年正月，後周殿前都點檢趙匡胤在陳橋驛被諸軍擁立，「有以黃衣加太祖身」，回師開封受禪，國號宋。此後削平荊南、湖南、後蜀、南漢、南唐，吳越納土，979年滅北漢。1004年與遼訂澶淵之盟，1038年後與西夏屢戰。神宗用王安石推行新法。" />
