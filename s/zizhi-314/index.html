    <title>子之之亂（齊破燕）（前316年） · 華夏歷史輿圖</title>
    <meta name="description" content="燕王噲聽信說客，屬國於相子之，又收三百石以上吏印交子之；子之南面行王事，噲反為臣。三年，國大亂。將軍市被與太子平謀攻子之，不克，搆難數月，死者數萬。齊王令章子將五都之兵伐燕，士卒不戰，城門不閉，燕君噲死，齊大勝。" />
