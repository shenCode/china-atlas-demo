    <title>宛、穰、安眾之戰（曹操與張繡）（197年） · 華夏歷史輿圖</title>
    <meta name="description" content="建安二年正月，曹操至宛，張繡投降後又反，曹軍戰敗，曹操中流矢，長子曹昂、姪曹安民遇害。同年冬曹操再征南陽，攻拔湖陽，生擒劉表將鄧濟，又下舞陰。三年三月圍張繡於穰；五月劉表出兵救繡，截斷曹軍後路。" />
