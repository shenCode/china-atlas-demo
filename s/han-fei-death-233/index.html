    <title>韓非死於秦獄（前233年） · 華夏歷史輿圖</title>
    <meta name="description" content="秦王政讀韓非之書而歎賞，急攻韓，韓遣韓非使秦。李斯、姚賈毀之，說他終為韓不為秦，不如以法誅之；秦王下吏治非。「李斯使人遺非藥，使自殺。」韓非欲自陳，不得見。秦王後悔，使人赦之，韓非已死。" />
