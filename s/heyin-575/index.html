    <title>河陰之役（周武帝初伐齊）（575年） · 華夏歷史輿圖</title>
    <meta name="description" content="建德四年七月壬午，周武帝親率六軍六萬人直指河陰，八月入齊境，下令不得伐樹踐踏禾苗，親率諸軍攻拔河陰大城，進攻子城未克。周武帝患病，九月夜間班師，水軍焚舟而退；宇文憲、于翼、李穆等所到之處攻克三十餘城，皆棄而不守。" />
