    <title>清口之戰（楊行密破朱全忠）（897年） · 華夏歷史輿圖</title>
    <meta name="description" content="乾寧四年，朱全忠既得兗、鄆，大舉擊楊行密：遣龐師古以徐、宿、宋、滑之兵七萬壁清口，將趣揚州；葛從周壁安豐，將趨壽州；全忠自頓宿州。朱瑾壅淮上流欲灌之，有以告者，師古以為惑眾而斬之。十一月，淮水大至，汴軍駭亂，師古敗死，葛從周亦退。" />
