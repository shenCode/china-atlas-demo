    <meta name="description" content="漢武帝派衛青、霍去病各率五萬騎深入漠北。霍去病出代郡，「絕大幕」，俘獲屯頭王、韓王等三人及將軍、相國等八十三人，「封狼居胥山，禪於姑衍，登臨翰海」。衛青出定襄，擊敗單于主力。此後「匈奴遠遁，而幕南無王庭」。" />
