    <title>班固（32–92年） · 華夏歷史輿圖</title>
    <meta name="description" content="字孟堅，扶風安陵人，班超之兄。繼承父親班彪的事業，歷二十餘年撰成《漢書》，是第一部紀傳體斷代史；又作〈兩都賦〉，隨竇憲北征時撰〈燕然山銘〉。後因竇憲案牽連，死於獄中。《漢書》的八表與〈天文志〉由其妹班昭等續成。" />
