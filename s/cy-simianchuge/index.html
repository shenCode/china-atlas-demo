    <meta name="description" content="比喻四面受敵，陷入孤立無援的絕境。項羽軍壁垓下，兵少食盡，漢軍及諸侯兵圍之數重。「夜聞漢軍四面皆楚歌」，項羽大驚：「漢皆已得楚乎？是何楚人之多也！」夜起飲於帳中，對虞姬悲歌「力拔山兮氣蓋世」，隨後率八百騎潰圍南走。" />
