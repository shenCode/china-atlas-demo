    <title>開禧北伐（1206年） · 華夏歷史輿圖</title>
    <meta name="description" content="開禧二年，韓侂冑主持北伐金朝，五月下詔伐金，宋軍各路相繼敗績，四川守將吳曦叛降金朝。1207年史彌遠與楊皇后密謀殺死韓侂冑，次年將其首級函送金朝，訂立嘉定和議，宋對金改稱姪為稱伯，歲幣增至三十萬。" />
