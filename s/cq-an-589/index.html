    <title>鞌之戰（前589年） · 華夏歷史輿圖</title>
    <meta name="description" content="齊頃公十年，齊伐魯、衛，二國因郤克求救於晉。晉使郤克以車八百乘為中軍將，士燮將上軍，欒書將下軍，伐齊。六月壬申，兩軍合於靡笄之下；次日戰於鞌，郤克傷而不退，齊師敗，頃公與逄丑父易位乃免。齊歸魯、衛侵地。" />
