    <title>商鞅伐魏，詐虜公子卬（前341年） · 華夏歷史輿圖</title>
    <meta name="description" content="魏在馬陵大敗於齊之後，衛鞅向孝公說：秦與魏如人有腹心之疾，不是魏併秦，就是秦併魏，可乘此時伐魏。孝公使衛鞅將兵伐魏，魏使公子卬迎戰。兩軍相距，衛鞅致書公子卬，說昔日相好，不忍相攻，願面見會盟、樂飲罷兵。" />
