    <title>前秦滅前涼（洪池、赤岸之戰）（376年） · 華夏歷史輿圖</title>
    <meta name="description" content="苻堅遣苟萇、毛盛、梁熙、姚萇等率騎十三萬伐張天錫於姑臧。梁熙、王統自清石津攻陷河會城；苟萇自石城津渡河，與梁熙會攻纏縮城，又陷之。天錫遣掌據率三萬與馬建陣於洪池，馬建降秦，掌據被殺。苟萇進入清塞，天錫又遣趙充哲率勁卒五萬戰於赤岸，大敗。" />
