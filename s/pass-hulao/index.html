    <meta name="description" content="魯襄公二年（前571），諸侯會於戚，孟獻子請「城虎牢以偪鄭」，遂城虎牢，鄭人乃與晉和。楚漢相爭時，酈食其勸劉邦「塞成皋之險」。唐汜水縣即鄭之制邑、漢之成皋縣，一名虎牢。" />
