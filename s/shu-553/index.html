    <title>尉遲迥平蜀（553年） · 華夏歷史輿圖</title>
    <meta name="description" content="梁武陵王蕭紀在蜀稱帝，率眾東下。西魏以尉遲迥督元珍、乙弗亞等六軍，甲士一萬二千，騎萬匹伐蜀；魏廢帝二年春，自散關由固道出白馬，趣晉壽，開平林舊道。前軍至劍閣，蕭紀所署安州刺史樂廣先降，梁州刺史楊乾運亦以潼州降。" />
