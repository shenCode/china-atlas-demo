    <title>垓下之戰（前202年） · 華夏歷史輿圖</title>
    <meta name="description" content="項羽駐軍垓下，兵少食盡，被漢軍與諸侯軍重重包圍。夜裡聽到漢軍四面皆唱楚歌，項羽大驚：「漢皆已得楚乎？是何楚人之多也！」夜飲帳中，對美人虞姬、駿馬騅悲歌：「力拔山兮氣蓋世……」突圍後至烏江，亭長備船勸他渡江，他笑道：「天之亡我，我何渡為！" />
