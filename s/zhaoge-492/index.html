    <meta name="description" content="冬十月，趙鞅圍朝歌，駐軍城南。荀寅攻其外城之軍，使部眾由北門入城，自己衝陣而出，癸丑，奔邯鄲。朝歌為趙氏所得。十一月，趙鞅殺士皋夷。" />
