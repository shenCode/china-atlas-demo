    <title>射犬之戰（曹操取河內）（199年） · 華夏歷史輿圖</title>
    <meta name="description" content="張楊部將楊醜殺張楊，眭固又殺楊醜，率其眾歸附袁紹，屯於射犬。四月曹操進軍臨河，派史渙、曹仁渡河擊之；眭固留薛洪、繆尚守營，自率兵北上向袁紹求救，與史渙、曹仁遇於犬城，交戰大敗被斬。曹操渡河圍射犬，薛洪、繆尚率眾投降，曹操以魏种為河內太守。" />
