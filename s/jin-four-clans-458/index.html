    <meta name="description" content="晉出公十七年，知伯與趙、韓、魏共分范氏、中行氏之地以為己邑。出公怒，告齊、魯，欲伐四卿；四卿反攻出公，出公奔齊，死於道。知伯立昭公曾孫驕為晉君，晉政皆決於知伯。" />
