    <title>樂毅伐齊（前284年） · 華夏歷史輿圖</title>
    <meta name="description" content="燕昭王任用樂毅，聯合趙、楚、韓、魏、燕五國之兵伐齊，大破齊軍於濟西，攻入臨淄。樂毅留在齊地五年，攻下七十餘城，只剩莒與即墨未下。燕昭王死後，田單以反間使燕惠王撤換樂毅，又以火牛陣反攻，齊國復國。" />
