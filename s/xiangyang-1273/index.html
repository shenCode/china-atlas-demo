    <title>襄樊之戰（1268年） · 華夏歷史輿圖</title>
    <meta name="description" content="至元五年（1268）起元軍圍困襄陽、樊城，築城立寨、斷絕援道。宋軍堅守五年。至元十年（1273）正月，阿里海牙等大舉進攻樊城，攻克之；二月襄陽守將呂文煥懼而請降。長江中游門戶洞開，元軍隨即沿江東下。" />
