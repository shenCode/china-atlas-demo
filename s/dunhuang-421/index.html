    <title>敦煌之陷（西涼之亡）（421年） · 華夏歷史輿圖</title>
    <meta name="description" content="李翻與弟敦煌太守李恂等棄敦煌奔北山，沮渠蒙遜以索元緒代守敦煌。李恂率數十騎重入敦煌，索元緒東奔涼興，宋承等推李恂為涼州刺史。蒙遜遣世子率眾來攻，李恂閉門不戰；蒙遜三面築堤，引水灌城，李恂遣壯士一千連版為橋，欲暗中決堤，蒙遜勒兵迎戰，屠其城。" />
