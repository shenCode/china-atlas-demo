    <title>滑臺之陷（檀道濟北救）（430年） · 華夏歷史輿圖</title>
    <meta name="description" content="到彥之北伐收復河南後，十一月虎牢再陷，到彥之自滑臺奔退，留朱脩之戍守滑臺。宋文帝遣檀道濟北討，於東平壽張大破魏安平公乙旃眷，進至濟水之上，連戰二十餘日，前後數十交，但魏軍勢盛。" />
