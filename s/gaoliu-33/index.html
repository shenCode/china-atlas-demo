    <title>高柳、繁畤之戰（33年） · 華夏歷史輿圖</title>
    <meta name="description" content="光武遣大司馬吳漢率四將軍擊盧芳將賈覽於高柳，戰不利；驃騎大將軍杜茂與賈覽戰於繁畤，茂軍敗績。次年正月，吳漢率捕虜將軍王霸等五將軍再擊賈覽於高柳，匈奴遣騎救覽，諸將與戰，卻之。" />
