    <title>巫蠱之禍（前91年） · 華夏歷史輿圖</title>
    <meta name="description" content="晚年的漢武帝疑心有人以巫蠱詛咒自己，命江充等查辦。江充在太子劉據宮中掘出蠱物，太子恐懼，與皇后衛子夫謀殺江充，發兵與丞相劉屈氂大戰於長安，死者數萬。太子兵敗自殺，衛皇后亦自盡。" />
