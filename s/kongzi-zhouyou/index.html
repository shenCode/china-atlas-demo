    <title>孔子周遊列國（前498年） · 華夏歷史輿圖</title>
    <meta name="description" content="齊人送女樂給魯，季桓子受之，三日不聽政，孔子遂離開魯國。此後十四年，他帶着弟子先後到衞、曹、宋、鄭、陳、蔡、葉與楚境，在匡被拘，在宋險為桓魋所害，在陳、蔡之間絕糧，始終不得任用；前484年季康子以幣相迎，才回到魯國。" />
