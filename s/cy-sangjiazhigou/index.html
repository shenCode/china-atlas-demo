    <title>喪家之狗（前492年） · 華夏歷史輿圖</title>
    <meta name="description" content="意為失去依靠、無處可歸的人。孔子到鄭國，與弟子走散，獨自站在外城東門。鄭人對子貢說：東門有個人，「纍纍若喪家之狗」。子貢如實轉告，孔子欣然而笑：形狀是末節，「而謂似喪家之狗，然哉！然哉！」" />
