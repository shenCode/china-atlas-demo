    <title>秦昭王賜白起死於杜郵（前257年） · 華夏歷史輿圖</title>
    <meta name="description" content="長平之後，白起與應侯范雎有隙，又不肯再將兵攻邯鄲，被免為士伍，遷出咸陽。行至杜郵，秦昭王與群臣議，以為他怏怏不服，有餘言，「乃使使者賜之劍，自裁」。白起引劍將自剄，說：長平之戰，趙卒降者數十萬人，我詐而盡坑之，是足以死。遂自殺。" />
