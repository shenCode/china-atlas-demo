    <title>曲沃代翼（武公併晉）（前679年） · 華夏歷史輿圖</title>
    <meta name="description" content="晉自昭侯封桓叔於曲沃，曲沃強於翼，三世相攻近七十年。晉侯緡二十八年，曲沃武公伐晉侯緡，滅之，盡以其寶器賂周釐王；釐王命武公為晉君，列為諸侯，盡併晉地。小宗取代大宗，晉自此出於曲沃一支。" />
