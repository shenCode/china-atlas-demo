    <title>澶淵之盟（1004年） · 華夏歷史輿圖</title>
    <meta name="description" content="景德元年遼聖宗與蕭太后大舉南下，宋真宗在寇準等人勸說下親征。遼軍至澶州北，主帥蕭撻凜（撻覽）出陣時中伏弩而死；真宗至澶州，渡河登北城樓撫慰諸軍。十二月遼使來講和，雙方立誓：宋每年給遼絹二十萬匹、銀十萬兩，兩國以兄弟相稱。" />
