    <meta name="description" content="延光二年，班勇為西域長史，率兵五百出屯柳中。次年正月至樓蘭，鄯善歸附；龜茲王白英率姑墨、溫宿自縛來降。班勇發其兵萬餘人至車師前王庭，擊走匈奴伊蠡王，車師前部復通。" />
