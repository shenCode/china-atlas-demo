    <title>賈似道（1213–1275年） · 華夏歷史輿圖</title>
    <meta name="description" content="字師憲，台州人，制置使賈涉之子，因姊姊為宋理宗貴妃而得重用。1259年鄂州之戰私下向忽必烈求和，卻謊報大捷，此後專權十餘年，推行公田法。襄陽被圍數年不救，1275年丁家洲兵敗，被貶後在漳州木綿庵被押送官鄭虎臣所殺。" />
