    <meta name="description" content="黃河南岸的要地，扼三門、砥柱之險，是關中東出的門戶；今河南三門峽。《公羊傳》說周初周公、召公分治天下，以此為界：「自陜而東者，周公主之；自陜而西者，召公主之。」春秋時為虢國之地，其都上陽，前655年晉假道於虞滅虢，圍上陽。" />
