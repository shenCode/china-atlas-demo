    <title>長社之戰（184年） · 華夏歷史輿圖</title>
    <meta name="description" content="朱儁先與潁川黃巾波才交戰失利，皇甫嵩進保長社。波才率大眾圍城，嵩兵少，軍心恐懼。當夜大風，皇甫嵩令軍士束苣登城，遣銳士潛出圍外縱火大呼，城上舉火相應，乘勢鼓譟衝擊，黃巾驚亂奔走。騎都尉曹操率兵適至，與皇甫嵩、朱儁合兵再戰，大破之，斬首數萬。" />
