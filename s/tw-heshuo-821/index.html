    <title>河朔再叛（朱克融、王庭湊）（821年） · 華夏歷史輿圖</title>
    <meta name="description" content="憲宗末年河北三鎮皆歸朝廷。穆宗長慶元年，幽州將士久困京師求官不得者朱克融等放歸，軍亂，囚節度使張弘靖而立克融；成德都知兵馬使王庭湊結牙兵殺節度使田弘正及其家屬將吏三百餘人，自稱留後。朝廷發諸道兵討之，饋運不繼，無功；魏博史憲誠又逼殺田布。" />
