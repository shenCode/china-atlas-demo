    <title>靈寶西原之戰（潼關失守）（756年） · 華夏歷史輿圖</title>
    <meta name="description" content="哥舒翰守潼關半年，正月擊卻安慶緒。六月，朝廷促戰，翰引兵出關；己丑，遇崔乾祐之軍於靈寶西原，官軍大敗，翰獨與麾下百餘騎走，自首陽山西渡河入關。辛卯，乾祐進攻潼關，克之。玄宗遂棄長安西走，至馬嵬驛而兵變。" />
