    <meta name="description" content="智伯率韓、魏圍趙襄子於晉陽。趙襄子暗中與韓、魏約定，夜裡派人殺守堤的官吏，決水反灌智伯軍。智伯軍救水而亂，韓、魏從兩翼夾擊，襄子從正面進攻，大敗智伯，殺智伯，盡滅智氏之族；三家分智氏之田。" />
