    <title>唐平淄青（李師道）（818年） · 華夏歷史輿圖</title>
    <meta name="description" content="淄青自李正己以來四世割據五十餘年。淮西既平，李師道請獻三州而復悔，元和十三年七月憲宗下詔討之，諸道兵四面進。師道疑其都知兵馬使劉悟，潛令副使張暹斬之；暹以告悟，悟自陽穀還兵襲鄆州，十四年二月斬師道父子，函首送田弘正營。" />
