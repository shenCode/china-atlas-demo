    <title>元昊稱帝（1038年） · 華夏歷史輿圖</title>
    <meta name="description" content="党項首領元昊於十月十一日在郊壇備禮即皇帝位，「國稱大夏，年號天授禮法延祚」，史稱西夏。他又自製蕃書，命野利仁榮演繹成十二卷，教國人用以紀事，並以之翻譯《孝經》《爾雅》等書。宋拒絕承認，雙方隨即開戰。" />
