    <meta name="description" content="名趙佶，宋神宗第十一子，1100年即位。書畫造詣極高，創「瘦金體」，主持編撰《宣和畫譜》，但寵信蔡京、童貫等人，大興「花石綱」，聯金滅遼反招金兵南下。1125年禪位，靖康之變被俘，死於五國城。" />
