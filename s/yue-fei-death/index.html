    <title>岳飛冤死（1141年） · 華夏歷史輿圖</title>
    <meta name="description" content="紹興十一年，岳飛被秦檜等誣以謀反，下大理寺獄，十二月被殺，其子岳雲、部將張憲同死。韓世忠不平，質問秦檜，秦檜答：「飛子雲與張憲書雖不明，其事體莫須有。」韓世忠說：「『莫須有』三字，何以服天下？」" />
