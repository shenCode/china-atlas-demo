    <title>楊素平江南（590年） · 華夏歷史輿圖</title>
    <meta name="description" content="江南李稜等聚眾起事，大者數萬，小者數千，殺害長吏，隋以楊素為行軍總管討之。楊素率舟師自楊子津入，擊破據京口的朱莫問；浙江賊帥高智慧自號東揚州刺史，有船艦千艘，楊素自晨至午後苦戰破之，高智慧逃入海中，楊素從餘姚泛海追至永嘉。" />
