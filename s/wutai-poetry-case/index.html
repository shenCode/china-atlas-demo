    <meta name="description" content="元豐二年，御史李定、舒亶、何正臣摘取蘇軾謝表中的語句，又羅織他的詩作，指為譏謗朝政，把他逮捕押入御史臺獄，欲置之死地，審訊許久不決。神宗獨憐之，從輕發落，貶為黃州團練副使安置。蘇軾在黃州築室於東坡，自號東坡居士。" />
