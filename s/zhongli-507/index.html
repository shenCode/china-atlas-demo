    <title>鍾離之戰（506年） · 華夏歷史輿圖</title>
    <meta name="description" content="天監五年，北魏中山王元英率大軍圍鍾離，號稱百萬，於淮河上架橋連營。梁遣曹景宗、韋叡馳援，次年四月淮水暴漲，馮道根等乘戰艦焚斷魏軍浮橋，大破魏軍於邵陽洲，斬獲以萬計。" />
