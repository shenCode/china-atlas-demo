    <title>五原、白道之戰（六鎮之亂初起）（524年） · 華夏歷史輿圖</title>
    <meta name="description" content="正光五年三月，沃野鎮人破落汗拔陵聚眾反，殺鎮將，號真王元年。北魏以臨淮王元彧都督北征，五月元彧敗於五原，削除官爵；朝廷改以尚書令李崇為大都督，率廣陽王元淵等北討，七月都督崔暹又失利於白道，李崇率眾退還平城。" />
