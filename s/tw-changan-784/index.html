    <meta name="description" content="涇原兵變，朱泚據長安稱帝，德宗奔奉天、梁州。興元元年五月庚寅，李晟大陳兵，諭以收復京城；戊戌，陳兵於光泰門外，遣騎、步兵直抵苑牆。泚與姚令言率餘眾西走，猶近萬人；長安復為唐有。" />
