    <title>巴陵之戰（551年） · 華夏歷史輿圖</title>
    <meta name="description" content="侯景攻陷郢城後，留丁和守江夏，遣宋子仙率一萬為前驅造巴陵，自率全軍水陸繼進，將進寇荊州。王僧辯悉收江渚米糧、沉公私船於水，乘城固守，偃旗臥鼓，若無人然。侯景頻戰挫敗，所遣任約又為胡僧祐、陸法和大破於赤亭並被生擒，侯景遂燒營夜遁。" />
