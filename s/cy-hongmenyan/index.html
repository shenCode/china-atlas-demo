    <meta name="description" content="指不懷好意、暗藏殺機的宴會。劉邦先入關中，項羽大怒，欲擊之。劉邦次日帶百餘騎到鴻門謝罪。席間范增數次示意項羽下手，項羽不應；范增使項莊舞劍，意在沛公，項伯也拔劍起舞以身遮護。樊噲闖帳，劉邦藉口如廁脫身，從小路逃回霸上。" />
