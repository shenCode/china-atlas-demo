    <title>玄武門之變（626年） · 華夏歷史輿圖</title>
    <meta name="description" content="武德九年六月四日，秦王李世民率長孫無忌、尉遲敬德、房玄齡、杜如晦等在玄武門誅殺太子李建成、齊王李元吉。《舊唐書》說是二人先「謀害太宗」。數日後李世民被立為皇太子，總攬朝政，八月即位。" />
