    <title>海上之盟（1120年） · 華夏歷史輿圖</title>
    <meta name="description" content="金興而遼衰，遼之降人趙良嗣獻聯金滅遼以復燕雲之策。宋遣使自登州浮海通金，往返數年。宣和二年二月，遣趙良嗣、王瓖使金，約夾攻遼：金取中京，宋取燕京，事成宋以舊輸遼之歲幣與金。因使者皆由海道，史稱海上之盟。兩年後宋攻燕不克，燕京為金所取。" />
