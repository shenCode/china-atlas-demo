    <title>桂陵之戰（前353年） · 華夏歷史輿圖</title>
    <meta name="description" content="魏圍趙都邯鄲，趙向齊求救。齊威王以田忌為將、孫臏為師。田忌想引兵直赴趙國，孫臏說：魏的精兵都在外，國內空虛，「君不若引兵疾走大梁，據其街路，衝其方虛，彼必釋趙而自救」。田忌從之，魏軍回師，齊在桂陵迎擊，大破魏軍。後人稱此計為「圍魏救趙」。" />
