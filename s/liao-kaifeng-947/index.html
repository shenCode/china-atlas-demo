    <title>契丹入汴，建號大遼（946年） · 華夏歷史輿圖</title>
    <meta name="description" content="後晉出帝對契丹稱孫不稱臣，雙方交戰。946年底遼太宗耶律德光大舉南下，晉軍主帥杜重威率二十萬大軍投降。947年正月遼軍入汴，晉出帝被押往北方，後晉亡。二月耶律德光在汴京建國號大遼，改元大同，並將晉朝的百官、宮人、圖籍、樂器等盡數送往上京。" />
