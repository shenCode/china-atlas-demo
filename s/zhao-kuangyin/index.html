    <meta name="description" content="後周殿前都點檢。960年正月出兵禦契丹，至陳橋驛，諸軍擁立，「有以黃衣加太祖身」，回師開封受禪，國號宋。次年召石守信等飲宴，勸其「多積金、市田宅以遺子孫」，諸將次日稱病解兵權。此後削平荊南、湖南、後蜀、南漢、南唐。" />
