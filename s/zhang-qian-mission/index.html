    <meta name="description" content="漢武帝派張騫出使大月氏，欲聯合夾擊匈奴。張騫途中被匈奴扣留十餘年，逃脫後經大宛、康居到達大月氏，又至大夏。大月氏已無意報仇，張騫歸途再被匈奴所得，前126年才逃回長安：出發時百餘人，去十三歲，唯二人得還。" />
