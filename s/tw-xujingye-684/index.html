    <title>徐敬業揚州起兵（684年） · 華夏歷史輿圖</title>
    <meta name="description" content="武后臨朝，廢中宗。光宅元年九月，英公徐敬業（李敬業）矯稱揚州司馬，據揚州起兵，求得貌類故太子賢者以號令。敬業不直趨洛陽而南取潤州；聞李孝逸將至，自潤州回軍，屯高郵之下阿溪。十一月孝逸進擊，因風縱火，敬業大敗，斬首七千級，溺死不可勝紀。" />
