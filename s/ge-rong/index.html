    <meta name="description" content="鮮于脩禮為元洪業所殺，元洪業請降，又為葛榮所殺。葛榮於博野白牛邏大敗北魏廣陽王元淵、章武王元融，元融戰死，遂自稱天子，國號齊；攻陷殷州、冀州、滄州，敗殺源子邕、裴衍於漳水曲，并吞杜洛周，眾號百萬。尒朱榮以精騎出滏口，於陣中擒之，餘眾悉降。" />
