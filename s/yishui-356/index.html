    <title>伊水之戰（桓溫收復洛陽）（356年） · 華夏歷史輿圖</title>
    <meta name="description" content="桓溫自江陵北伐，途經金城，見少年時所種柳已十圍，慨歎「木猶如此，人何以堪」。大軍至伊水，姚襄屯於水北，距水而戰；桓溫親自披甲督弟桓沖及諸將奮擊，姚襄大敗，自相殘殺而死者數千人，越北邙西走，奔平陽。" />
