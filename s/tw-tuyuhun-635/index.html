    <title>李靖平吐谷渾（635年） · 華夏歷史輿圖</title>
    <meta name="description" content="貞觀九年，李靖為西海道行軍大總管，統侯君集、任城王道宗、薛萬均諸軍擊吐谷渾。閏四月癸酉，道宗敗吐谷渾於庫山；可汗伏允悉燒野草，輕兵走入磧。唐軍分兩道深入，五月追及伏允於烏海，大破之；侯君集等逾星宿川，至柏海，還與李靖軍合。" />
