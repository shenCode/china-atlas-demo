    <title>鳳翔之圍（朱全忠迎昭宗）（901年） · 華夏歷史輿圖</title>
    <meta name="description" content="天復元年十一月，宦官韓全誨等劫昭宗入鳳翔，依李茂貞。戊辰，朱全忠至鳳翔，軍於城東，圍城踰年，城中食盡。三年正月甲子，車駕出鳳翔，幸全忠營，全忠素服待罪。昭宗自此入朱全忠之手。" />
