    <meta name="description" content="父親是天竺人，母親是龜茲公主，生於龜茲。前秦大將呂光破龜茲後將他帶到涼州，401年後秦姚興迎入長安，主持譯場，譯出《金剛經》《法華經》《大智度論》等三百餘卷，是中國佛經翻譯史上最重要的譯師之一。" />
