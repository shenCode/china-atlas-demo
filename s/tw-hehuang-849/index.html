    <title>三州七關歸唐（849年） · 華夏歷史輿圖</title>
    <meta name="description" content="吐蕃贊普死後無主，論恐熱與鄯州節度使尚婢婢連年相攻，邊將離散。大中三年，吐蕃所據之秦、原、安樂三州及石門等七關來降，詔涇原、靈武、鳳翔、邠寧、振武出兵應接。安史之亂後陷沒近九十年之隴右東部復歸於唐；閏十一月，宰相以克復河、湟請上尊號。" />
