    <meta name="description" content="冒頓單于把精兵藏起，只讓漢軍看到老弱。漢高帝傾全軍三十二萬人北追，多為步兵；高帝先至平城，步兵未到，冒頓縱精兵四十萬騎把他圍困在白登山，七天內外不得相救。高帝派使者暗中厚贈閼氏，閼氏勸冒頓解圍。此後漢以和親與歲贈維持與匈奴的和平。" />
