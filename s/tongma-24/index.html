    <title>鄡、館陶、蒲陽之戰（光武破銅馬）（24年） · 華夏歷史輿圖</title>
    <meta name="description" content="光武將擊銅馬，先遣吳漢北發十郡兵；幽州牧苗曾不從，吳漢斬之而發其眾。秋，光武擊銅馬於鄡，吳漢率突騎來會清陽。光武堅營自守，擊取出掠之賊，斷其糧道；月餘賊食盡夜遁，追至館陶大破之。" />
