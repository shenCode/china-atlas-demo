    <title>樂毅奔趙，趙封之於觀津（前279年） · 華夏歷史輿圖</title>
    <meta name="description" content="燕昭王死，惠王立。惠王為太子時就與樂毅不合，田單乘機行反間，惠王使騎劫代樂毅為將。樂毅知道惠王不懷好意，遂西奔趙。趙王封樂毅於觀津，尊寵他，以警動燕、齊。" />
